- id: global_net_liquidity
  name: "Global Net Liquidity Tracker"
  type: api
  url: "https://api.stlouisfed.org/fred/series/observations"
  collector: macro_economic
  frequency: weekly
  category: financial_markets
  subcategory: liquidity
