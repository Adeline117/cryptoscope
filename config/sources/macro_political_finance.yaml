# --- Crypto-Adjacent Earnings ---

- id: crypto_adjacent_earnings
  name: "Crypto-Adjacent Public Company Earnings"
  type: api
  url: "https://query1.finance.yahoo.com/v8/finance/chart/"
  collector: macro_economic
  frequency: event_driven
  category: financial_markets
  subcategory: crypto_earnings
  priority: high
  enabled: true
  language: en
  notes: >
    Key tickers and data points:
    COIN (Coinbase) - trading revenue, subscription revenue, custody AUM, regulatory updates
    MSTR (MicroStrategy) - BTC holdings, avg purchase price, yield metric, convertible note details
    MARA (Marathon Digital) - hash rate, BTC mined, operating cost per BTC, energized capacity
    CLSK (CleanSpark) - hash rate growth, efficiency (J/TH), BTC held vs sold ratio
    RIOT (Riot Platforms) - hash rate, hosting revenue, power credits, BTC treasury
    NVDA (NVIDIA) - data center revenue (AI/crypto mining GPU demand proxy)
    SQ (Block/Square) - Cash App BTC revenue, BTC gross profit, TBD/Web5 updates
    PYPL (PayPal) - PYUSD stablecoin metrics, crypto trading volume, on/off ramp usage
    HOOD (Robinhood) - crypto trading revenue share, new coin listings, wallet MAUs
    GLXY.TO (Galaxy Digital) - trading revenue, mining, ventures portfolio, GDM AUM
    Earnings dates set up volatility windows. Guidance on crypto adoption metrics is forward-looking signal.


