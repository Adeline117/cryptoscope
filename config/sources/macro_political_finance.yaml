- id: fred_api
  name: "FRED API - Key Economic Series"
  type: api
  url: "https://api.stlouisfed.org/fred/series/observations"
  collector: macro_economic
  frequency: daily
  category: economic_data
  subcategory: fred
  priority: critical
  enabled: true
  language: en
  notes: >
    Core macro data feed. Key series IDs:
    Inflation: CPIAUCSL (CPI), CPILFESL (Core CPI), PCEPI (PCE), PCEPILFE (Core PCE),
    PPIFIS (PPI), CPIUFDSL (CPI Food), CPIENGSL (CPI Energy)
    Labor: PAYEMS (Nonfarm Payrolls), UNRATE (Unemployment Rate), ICSA (Initial Claims),
    CCSA (Continuing Claims), CES0500000003 (Avg Hourly Earnings), JTSJOL (JOLTS Job Openings)
    Growth: GDP (Real GDP), GDPC1 (Real GDP Quarterly), RSAFS (Retail Sales),
    INDPRO (Industrial Production), UMCSENT (UMich Consumer Sentiment),
    ISM_MFG (ISM Manufacturing PMI), ISM_SVC (ISM Services PMI)
    Rates: FEDFUNDS (Fed Funds Rate), DFF (Effective Fed Funds Daily),
    DGS2 (2-Year Treasury), DGS10 (10-Year Treasury), DGS30 (30-Year Treasury),
    T10Y2Y (10Y-2Y Yield Curve Spread), T10YFF (10Y-FF Spread),
    BAMLH0A0HYM2 (HY OAS Spread)
    Money & Liquidity: M2SL (M2 Money Supply), WALCL (Fed Total Assets),
    RRPONTSYD (Overnight Reverse Repo), WTREGEN (TGA Balance),
    WSHOSHO (Fed Holdings of Treasuries)
    FX & Volatility: DTWEXBGS (Trade-Weighted Dollar/DXY proxy),
    DEXUSEU (EUR/USD), DEXJPUS (USD/JPY), DEXCHUS (USD/CNY),
    VIXCLS (VIX Close)
    Commodities: GOLDAMGBD228NLBM (Gold London Fix), DCOILWTICO (WTI Crude),
    DCOILBRENTEU (Brent Crude)
    Housing: CSUSHPINSA (Case-Shiller Home Price), HOUST (Housing Starts),
    MORTGAGE30US (30-Year Mortgage Rate)

