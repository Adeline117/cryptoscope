  language: en
  notes: >
    Net Liquidity = Fed Balance Sheet (WALCL) - TGA (WTREGEN) - Reverse Repo (RRPONTSYD).
    BTC tracks net liquidity with ~0.85 R-squared over multi-month periods.
    Also track global M2 aggregate for macro liquidity regime.

