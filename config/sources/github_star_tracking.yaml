###############################################################################
# ANOMALY DETECTION THRESHOLDS
###############################################################################

anomaly_detection:
  z_score_thresholds:
    high: 3.0
    medium: 2.0
    notable: 1.5

  absolute_thresholds:
    stars_24h_auto_analyze: 500
    stars_7d_weekly_report: 2000

  sliding_window_days: 30
  min_data_points: 7

###############################################################################
# COLLECTION SCHEDULE
###############################################################################

schedule:
  star_counts: "0 */6 * * *"       # every 6 hours
  trending_scan: "0 8,20 * * *"    # twice daily
  new_repo_search: "0 10 * * 1"    # weekly on Monday
  developer_tracking: "0 12 * * *" # daily at noon UTC
