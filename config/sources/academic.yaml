# Academic search APIs
- id: semantic_scholar
  name: Semantic Scholar API
  type: api
  url: "https://api.semanticscholar.org/graph/v1"
  collector: academic_papers
  frequency: 6h
  category: academic
  subcategory: search
  priority: high
  enabled: true
  notes: "API key optional but recommended. Query for: DeFi, blockchain, smart contract, MEV, AMM"
  queries:
    - "decentralized finance DeFi"
    - "blockchain consensus"
    - "smart contract security"
    - "maximal extractable value MEV"
    - "automated market maker"
    - "sybil detection blockchain"
    - "cross-chain bridge"

- id: dblp
