<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>机会雷达 · Alpha Radar</title>
<style>
  :root{
    --bg:#080b10; --s1:#0f141c; --s2:#151b24; --s3:#1b2330; --s4:#232d3b;
    --border:#202a38; --border2:#334155;
    --text:#f5f7fa; --muted:#aeb8c6; --dim:#78869a;
    --accent:#3b82f6; --accent-t:#7db4ff; --accent-bg:#102341; --accent-b:#285796;
    --good:#71d083; --good-s:#46a758; --good-bg:#1b2a1e; --good-b:#366740;
    --danger:#ff977d; --danger-s:#e54d2e; --danger-bg:#391714; --danger-b:#853a2d;
    --warn:#ffca16; --warn-s:#ffc53d; --warn-bg:#302008; --warn-b:#714f19;
    --violet:#9b8cff; --violet-bg:#251e3e; --violet-b:#473876;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --row-h:48px; --shadow:0 18px 55px rgba(0,0,0,.22);
  }
  :root[data-theme="light"]{
    --bg:#f3f6fa; --s1:#fff; --s2:#f7f9fc; --s3:#eef3f8; --s4:#e3eaf2;
    --border:#dfe6ee; --border2:#cbd5e1; --text:#172033; --muted:#536174; --dim:#7b899c;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3; --shadow:0 18px 55px rgba(30,50,80,.09);
  }
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#f3f6fa; --s1:#fff; --s2:#f7f9fc; --s3:#eef3f8; --s4:#e3eaf2;
    --border:#dfe6ee; --border2:#cbd5e1; --text:#172033; --muted:#536174; --dim:#7b899c;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3; --shadow:0 18px 55px rgba(30,50,80,.09);}}
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable}
  body{margin:0;background:
    radial-gradient(circle at 10% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 34rem),
    radial-gradient(circle at 90% 0,color-mix(in srgb,var(--violet) 9%,transparent),transparent 30rem),var(--bg);
    color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1420px;margin:0 auto;padding:0 32px 72px}
  a{color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 14px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--accent),var(--violet));display:grid;place-items:center;
    font-weight:800;font-size:17px;color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
  h1{font-size:17px;font-weight:760;margin:0;letter-spacing:-.02em;line-height:1.25}
  h1 span{display:block;color:var(--dim);font-weight:500;font-size:11px;margin:3px 0 0;letter-spacing:.08em;text-transform:uppercase}
  .hr{display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--good-s);animation:pulse 2s infinite}
  .live.stale .pulse{background:var(--warn-s);animation:none}
  .live.dead .pulse{background:var(--danger-s);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,167,88,.5)}70%{box-shadow:0 0 0 6px rgba(70,167,88,0)}100%{box-shadow:0 0 0 0 rgba(70,167,88,0)}}
  .tgl{cursor:pointer;background:var(--s1);border:1px solid var(--border2);color:var(--muted);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:15px;transition:.18s ease}
  .tgl:hover{color:var(--text);transform:translateY(-1px);border-color:var(--accent)}
  .prog{height:2px;background:var(--accent);width:0;transition:width 1s linear;opacity:.7}

  /* tabs */
  .tabs{display:flex;gap:8px;margin:16px 0 0;overflow-x:auto;padding:4px;background:color-mix(in srgb,var(--s1) 85%,transparent);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .grp{display:flex;gap:4px;align-items:center}
  .grp+.grp{margin-left:4px;padding-left:8px;border-left:1px solid var(--border)}
  .tab{appearance:none;background:transparent;border:1px solid transparent;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:620;color:var(--muted);
    border-radius:9px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.16s ease}
  .tab:hover{color:var(--text);background:var(--s3)} .tab.on{color:var(--text);background:var(--s3);border-color:var(--border2);box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .tab .ct{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--s3);border-radius:999px;padding:1px 6px}
  .tab.on .ct{color:var(--accent-t);background:var(--accent-bg)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* lane head */
  .lanehead{display:grid;grid-template-columns:minmax(280px,1fr) minmax(420px,auto);align-items:center;gap:28px;margin:18px 0 12px;
    padding:22px 24px;background:linear-gradient(115deg,var(--s1),color-mix(in srgb,var(--s2) 84%,var(--accent-bg)));
    border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
  .lanetitle{font-size:16px;color:var(--muted);max-width:720px;line-height:1.55}
  .lanetitle b{color:var(--text)}
  .stat{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;justify-content:flex-end}
  .stat>div{min-width:118px;padding:2px 18px;border-left:1px solid var(--border)}
  .stat>div:first-child{border-left:0}
  .stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
  .stat .v{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:680;color:var(--text);line-height:1.25}
  .stat .v small{display:block;margin-top:3px;font-family:var(--sans);font-size:10.5px;color:var(--dim);font-weight:500;line-height:1.3;max-width:150px}
  details.readme{margin:0 0 16px;padding:0 4px}
  details.readme summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;user-select:none;display:inline-flex;align-items:center;gap:6px}
  details.readme summary::before{content:"▸";color:var(--dim)} details.readme[open] summary::before{content:"▾"}
  details.readme .rd{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--s1);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:11px 14px}
  details.readme .rd b{color:var(--text)}

  /* table */
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--s1);box-shadow:var(--shadow)}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:720px}
  .tbl th{position:sticky;top:0;z-index:2;background:var(--s2);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);text-align:left;padding:0 12px;height:34px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap}
  .tbl th.n{text-align:right} .tbl th.c{text-align:center}
  .tbl th.sortable::after{content:"↕";margin-left:5px;color:var(--dim);font-size:9px}
  .tbl th[aria-sort=ascending]::after{content:"▲";color:var(--accent-t)}
  .tbl th[aria-sort=descending]::after{content:"▼";color:var(--accent-t)}
  .tbl td{height:var(--row-h);padding:0 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  .tbl td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tbl td.c{text-align:center}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover td{background:color-mix(in srgb,var(--s3) 76%,var(--accent-bg))}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tbl tbody tr[aria-expanded="true"] td{background:var(--s3)}
  .up{color:var(--good)} .down{color:var(--danger)} .flat{color:var(--dim)}
  .tbl tr.flash-up td{animation:fu 1s ease-out} .tbl tr.flash-down td{animation:fd 1s ease-out}
  @keyframes fu{from{background:rgba(70,167,88,.20)}to{background:transparent}}
  @keyframes fd{from{background:rgba(229,77,46,.20)}to{background:transparent}}

  /* identity cell */
  .idc{display:flex;align-items:center;gap:9px;min-width:0}
  .tk{width:26px;height:26px;border-radius:7px;background:var(--s3);border:1px solid var(--border2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;text-transform:uppercase}
  .idc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .idc .sub{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--s3);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-good{background:var(--good-bg);color:var(--good);border-color:var(--good-b)}
  .b-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-b)}
  .b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
  .b-violet{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-b)}
  .b-accent{background:var(--accent-bg);color:var(--accent-t);border-color:var(--accent-b)}
  .glyphs{display:inline-flex;gap:3px}
  .g{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700}
  .g.ok{background:var(--good-bg);color:var(--good)} .g.bad{background:var(--danger-bg);color:var(--danger)}
  .g.na{background:var(--s3);color:var(--dim)}
  .mtri{display:inline-flex;gap:6px;font-family:var(--mono);font-size:11px}
  .hero{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
  .bar{display:inline-block;height:5px;border-radius:3px;background:var(--accent);vertical-align:middle;min-width:2px}
  .exp td{background:var(--s2);padding:12px 14px;white-space:normal;font-size:12.5px;color:var(--muted);line-height:1.6}
  .exp b{color:var(--text)} .exp .so{color:var(--accent-t);font-weight:600}
  .event-timeline{margin:16px 0 4px;padding:16px;border:1px solid var(--border2);border-radius:13px;background:var(--s1);color:var(--text)}
  .event-timeline-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .event-timeline-head h3{margin:0;font-size:13px;line-height:1.35}.event-timeline-head p{margin:4px 0 0;max-width:760px;color:var(--dim);font-size:10.5px;line-height:1.5}
  .event-chart{width:100%;height:260px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--s2)}
  .event-chart-fallback{height:100%;display:grid;place-items:center;padding:18px;text-align:center;color:var(--dim);font-size:11px}
  .event-clock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin-top:9px}
  .event-clock{min-width:0;padding:9px 10px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;background:var(--s2)}
  .event-clock.good{border-left-color:var(--good)}.event-clock.warn{border-left-color:var(--warn)}.event-clock.gap{border-left-color:var(--danger);border-style:dashed}
  .event-clock .tk{display:block;width:auto;height:auto;border:0;background:none;text-align:left;font:650 9.5px/1.3 var(--sans);letter-spacing:.06em;color:var(--dim)}
  .event-clock .tv{display:block;margin-top:3px;font:650 11px/1.45 var(--mono);color:var(--text);overflow-wrap:anywhere}.event-clock .ts{display:block;margin-top:2px;font-size:9.5px;line-height:1.4;color:var(--dim)}
  .event-timeline-note{display:flex;align-items:flex-start;gap:7px;margin-top:9px;color:var(--dim);font-size:10px;line-height:1.5}.event-timeline-note::before{content:"i";flex:none;display:grid;place-items:center;width:15px;height:15px;border:1px solid var(--border2);border-radius:50%;font:700 9px var(--mono);color:var(--accent-t)}
  .cascade-evidence{width:100%;margin-top:7px}.cascade-evidence>summary{cursor:pointer;color:var(--accent-t);font-size:11px}.cascade-evidence[open]>summary{margin-bottom:8px}
  .swipe-hint{display:none}
  .table-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:4px}
  .filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
  .filter{appearance:none;white-space:nowrap;border:1px solid var(--border);background:var(--s1);color:var(--muted);border-radius:8px;padding:7px 10px;font:600 11.5px var(--sans);cursor:pointer}
  .filter:hover{color:var(--text);border-color:var(--border2)}.filter.on{color:var(--accent-t);border-color:var(--accent-b);background:var(--accent-bg)}
  .filter .fc{margin-left:5px;font-family:var(--mono);color:var(--dim)}
  .search{width:220px;min-width:150px;border:1px solid var(--border2);background:var(--s1);color:var(--text);border-radius:9px;padding:8px 10px;font:12px var(--sans);outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:13px}
  .coverage-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
  .coverage-card{min-height:104px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--s1)}
  .coverage-card .ck{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;color:var(--muted)}
  .coverage-card .cv{margin-top:8px;font:700 18px/1.25 var(--mono);color:var(--text)}
  .coverage-card .cs{margin-top:5px;font-size:11px;line-height:1.45;color:var(--dim)}
  .skl{height:var(--row-h);border-bottom:1px solid var(--border);background:linear-gradient(90deg,var(--s1) 25%,var(--s3) 50%,var(--s1) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* 📋 打法 synthesis */
  .play{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;max-width:none;border:0;background:transparent;box-shadow:none;overflow:visible}
  .command{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:20px;padding:26px;
    border:1px solid var(--border2);border-radius:16px;background:linear-gradient(130deg,var(--s1),color-mix(in srgb,var(--accent-bg) 58%,var(--s2)));box-shadow:var(--shadow)}
  .decision-kicker{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:10.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .decision-kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 13%,transparent)}
  .command.actionable .decision-kicker::before{background:var(--good);box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 13%,transparent)}
  .decision-title{margin:0;font-size:30px;line-height:1.18;letter-spacing:-.035em;font-weight:780;color:var(--text)}
  .decision-copy{margin:11px 0 0;max-width:720px;color:var(--muted);font-size:14px;line-height:1.7}
  .command-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .jump{appearance:none;border:1px solid var(--border2);background:var(--s2);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer;font:600 12px var(--sans);transition:.16s ease}
  .jump:hover{border-color:var(--accent);background:var(--accent-bg);transform:translateY(-1px)}
  .jump.primary{border-color:var(--accent-b);background:var(--accent);color:#fff}
  .decision-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .fact{min-height:92px;padding:15px;background:color-mix(in srgb,var(--s1) 92%,transparent)}
  .fact .fk{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .fact .fv{display:block;font:700 20px/1.25 var(--mono);color:var(--text)}
  .fact .fs{display:block;margin-top:4px;font-size:10.5px;line-height:1.35;color:var(--dim)}
  .fact.warn .fv{color:var(--warn)}.fact.good .fv{color:var(--good)}.fact.danger .fv{color:var(--danger)}
  .evidence-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .evidence-card{padding:16px 18px;border:1px solid var(--border);border-radius:13px;background:var(--s1)}
  .evidence-card .ek{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--text)}
  .evidence-card .ev{margin-top:8px;font:700 18px/1.3 var(--mono);color:var(--text)}
  .evidence-card .es{margin-top:5px;color:var(--dim);font-size:11.5px;line-height:1.5}
  .meter{height:5px;margin-top:11px;border-radius:99px;background:var(--s3);overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
  .market-coverage{grid-column:1/-1;padding:20px 22px;border:1px solid var(--border);border-radius:14px;background:var(--s1);box-shadow:var(--shadow);min-width:0}
  .market-coverage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:13px}
  .market-coverage-head h3{margin:0;font-size:15px;line-height:1.35;color:var(--text)}
  .market-coverage-head p{margin:4px 0 0;max-width:820px;font-size:11.5px;line-height:1.55;color:var(--dim)}
  .market-coverage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .market-coverage-card{position:relative;min-width:0;padding:14px 15px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:11px;background:var(--s2)}
  .market-coverage-card.ok{border-left-color:var(--good)}.market-coverage-card.partial{border-left-color:var(--warn)}.market-coverage-card.unavailable{border-left-color:var(--danger)}
  .market-coverage-card:last-child{grid-column:1/-1}
  .market-coverage-card .mch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .market-coverage-card .mct{min-width:0;font-size:12.5px;font-weight:730;color:var(--text)}
  .market-coverage-card .mct small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--dim)}
  .market-coverage-card .mcv{margin-top:9px;font:700 15px/1.35 var(--mono);color:var(--text);overflow-wrap:anywhere}
  .market-coverage-card .mcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .market-coverage-card .mcg{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:10.5px;line-height:1.5;color:var(--dim);overflow-wrap:anywhere}
  .market-coverage-card .mcg b{color:var(--muted)}

<script>

const eventChartRows=new Map(),mountedEventCharts=new Set();

function finitePrice(value){const n=Number(value);return Number.isFinite(n)&&n>0?n:null}

function eventChartModel(r){

function renderTable(laneId, rows, cols, cfg){
  const allRows=rows||[], filters=cfg.filters||[], activeFilter=filterState[laneId]||filters[0]?.k;
  const query=(searchState[laneId]||"").trim().toLowerCase();
  const active=filters.find(x=>x.k===activeFilter);
  rows=active?allRows.filter(active.test):allRows;
  if(query)rows=rows.filter(r=>(cfg.searchText?cfg.searchText(r):`${r.symbol||""} ${r.token||""}`).toLowerCase().includes(query));
  const tools=filters.length?`<div class="table-tools"><div class="filters" role="group" aria-label="决策过滤">${filters.map(f=>`<button class="filter ${f.k===activeFilter?'on':''}" data-filter="${f.k}" aria-pressed="${f.k===activeFilter}">${f.label}<span class="fc">${allRows.filter(f.test).length}</span></button>`).join("")}</div><input class="search" type="search" value="${esc(searchState[laneId]||'')}" placeholder="搜索代币 / 合约" aria-label="搜索当前列表"></div>`:"";
  if(!allRows.length) return `<div class="scroll"><div class="empty">${cfg.empty||"这轮没有信号 —— 好机会本就稀疏,不是坏了。"}</div></div>`;
  if(!rows.length)return `${tools}<div class="scroll"><div class="empty">${query?'没有匹配的代币。':activeFilter==='actionable'?'当前没有通过全部门禁且报价仍有效的机会。切换到「观察」可查看仍在积累证据的事件。':'这个状态当前没有事件。'}</div></div>`;
  // sort
  const ss=sortState[laneId];
  if(ss){const c=cols.find(x=>x.k===ss.col); if(c&&c.sort){rows=rows.slice().sort((a,b)=>{const x=c.sort(a),y=c.sort(b);const r=(x>y?1:x<y?-1:0);return ss.dir==="asc"?r:-r})}}
  const head=cols.map(c=>`<th class="${c.n?'n':c.c?'c':''} ${c.sort?'sortable':''}" data-col="${c.k}" ${c.sort?'tabindex="0"':''} ${ss&&ss.col===c.k?`aria-sort="${ss.dir==='asc'?'ascending':'descending'}"`:''}>${c.label}</th>`).join("");
  const prev=prevKey[laneId]||{};
  const cur={};
  const body=rows.map((r,i)=>{
    const id=cfg.id(r); const hv=cfg.flash?cfg.flash(r):null; if(hv!=null)cur[id]=hv;
    let fc=""; if(hv!=null&&prev[id]!=null&&prev[id]!==hv)fc=hv>prev[id]?"flash-up":"flash-down";
    const tds=cols.map(c=>`<td class="${c.n?'n':c.c?'c':''}">${c.cell(r)}</td>`).join("");
    const detailId=`detail-${laneId}-${i}`;
    const det=cfg.detail?`<tr class="exp" id="${detailId}" hidden><td colspan="${cols.length}">${cfg.detail(r)}</td></tr>`:"";
    const interactive=cfg.detail?`tabindex="0" aria-expanded="false" aria-controls="${detailId}" aria-label="展开 ${esc(r.symbol||r.name||'该行')} 详情"`:'';
    return `<tr class="${fc}" data-row="${esc(id)}" data-i="${i}" ${interactive}>${tds}</tr>${det}`;
  }).join("");
  prevKey[laneId]=cur;
  return `${tools}<div class="scroll"><div class="swipe-hint" aria-hidden="true">左右滑动查看更多 →</div><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function avoidRows(d){return (d?.opportunities||[]).filter(o=>["avoid","caution"].includes(o.rug?.level)||["moderate","severe"].includes(o.manipulation?.level)||o.exit_risk?.level==="high")
  .sort((a,b)=>{const sev=x=>(x.rug?.level==="avoid"?3:0)+(x.manipulation?.level==="severe"?3:x.manipulation?.level==="moderate"?1:0)+(x.exit_risk?.level==="high"?2:0);return sev(b)-sev(a)})}

const OPMAP={dump:{label:"正在出货",b:"danger",so:"对手盘可能是操盘簇，别接飞刀；只用于避开，不生成做空指令。"},armed:{label:"庄在场·待动",b:"warn",so:"盯着等它出手,现在不是买卖点。"},accum:{label:"疑似吸筹",b:"warn",so:"别跟买——跟庄吸筹对散户是负EV,且这「吸筹」可能是庄的wash farm诱饵。当观察,不当买入信号。"},issuer:{label:"项目方持币",b:"violet",so:"别当妖币,防的是团队解锁砸盘。"},faded:{label:"庄已走·散",b:"",so:"当普通币看。"},unknown:{label:"查不清",b:"accent",so:"数据不足,别信这条。"}};

// live 'deposit' event = operator cluster moving inventory to a CEX right now (leading
// dump signal). Fresh only (flow scan within 3h) so a stale phase isn't shown as live.
function depNow(r){return r&&r.live_phase==="deposit"&&r.flow_scan_ts&&(Date.now()-new Date(r.flow_scan_ts).getTime()<3*3600*1000)?1:0}
function classOp(r){if(!r.ok)return"unknown";const v=r.verdict||"",a=r.acquisition||"";if(a==="allocated")return"issuer";if(["distributing","exited_by_selling","present_rotating_confirmed","distributing_or_churn"].includes(v))return((r.largest_entity_pct||0)<5&&(r.dominant_wallets||0)<=1)?"faded":"dump";if(v==="loaded_accumulating")return"accum";if(["loaded_live_operator","live_operator"].includes(v))return(r.current_graph_available&&(r.largest_entity_pct||0)<2)?"unknown":"armed";if(v==="loaded_dormant")return"armed";if(["dispersed","treasury","treasury_only"].includes(v))return"faded";return"unknown"}

function coverageChip(state,label){
  const cfg=state==="ok"?["b-good","本轮可判"]:state==="partial"?["b-warn","部分可判"]:["b-danger","不可判"];
  return `<span class="chip ${cfg[0]}">${esc(label||cfg[1])}</span>`;
}
function streamCoverageState(available,streams){
  if(available!==true||!streams.length)return "unavailable";
  if(streams.every(x=>x.status==="live"&&!x.stale&&!(x.open_gaps||0)))return "ok";
  return streams.some(x=>["live","degraded"].includes(x.status)&&!x.stale)?"partial":"unavailable";
}
function worstCoverageState(...states){
  return states.includes("unavailable")?"unavailable":states.includes("partial")?"partial":"ok";
}
function ledgerTraceState(trace){
  if(!trace||!["ok","partial"].includes(trace.state))return "unavailable";
  return trace.state==="partial"||(trace.orphan_rows||0)>0?"partial":"ok";
}
function traceReadbackUnavailable(trace){
  if(!trace||!["ok","partial","unavailable"].includes(trace.state))return "不可判";
  return (trace.readback_unavailable_rows??0)+(trace.readback_error_rows??0);
}
function coverageCount(n,total){return total?`${n}/${total}`:"?/?"}

      <div class="fact warn"><span class="fk">数据覆盖</span><span class="fv">${sourceOk}/${sourceHealth.length||'?'}</span><span class="fs">仅为上币来源健康，不代表全市场覆盖</span></div>
    </div></section>`;
  h+=renderMarketCoverageMatrix();
  if(activeLaunch.length){
    h+=`<section class="play-sec" style="grid-column:1/-1"><div class="ph">A3 人工小额验证窗 <span class="pd">只读报价到期即失效 · 永不自动交易</span></div>${activeLaunch.slice(0,4).map(r=>{const ca=r.current_assessment||{};return `<div class="prow"><span class="chip b-good">${esc(expiryText(ca))}</span> <b>${esc(r.symbol)}</b> 当前只读报价参考 <span class="num">${ca.entry_reference_price!=null?'$'+esc(ca.entry_reference_price):'不可得'}</span> · 当前失效参考 ≤ <span class="num">${ca.invalidation_reference_price!=null?'$'+esc(ca.invalidation_reference_price):'不可得'}</span> · 最大 <span class="num">${usd(ca.notional_usd||r.max_notional_usd)}</span><button class="jump" data-jump="launch">看完整证据</button></div>`}).join('')}</section>`;
  }
  h+=carryHealthHtml(carryHealth);
  const carryValid=Number.isFinite(pp.n_proxy_closed)?pp.n_proxy_closed:(carryEvidence?.n_proxy??0);
  const carryTotal=Number.isFinite(pp.n_closed_total)?pp.n_closed_total:carryValid;
  const carryExcluded=Number.isFinite(pp.n_closed_excluded)?pp.n_closed_excluded:Math.max(0,carryTotal-carryValid);
  h+=`<section class="evidence-grid" aria-label="证据与覆盖">
    <div class="evidence-card"><div class="ek"><span>早期机会前向验证</span><span class="chip b-warn">${esc(launchEvidence?.edge_verdict||'不可判')}</span></div><div class="ev">${launchEligible.SMALL_PROBE??0}/${launchTarget} <small class="dim">预注册候选</small></div><div class="es">WATCH ${launchEligible.WATCH??0}/${launchTarget} · ${esc(launchValidation.protocol_state||launchValidation.state||'collecting')}；只认 v5 前向 24h、union UTC 日历与 sequential SPA。</div><div class="meter"><i style="width:${Math.min(100,(launchEligible.SMALL_PROBE||0)/launchTarget*100)}%"></i></div></div>
    <div class="evidence-card"><div class="ek"><span>Carry 报价代理</span><span class="chip b-warn">${esc(carryEvidence?.edge_verdict||'不可判')}</span></div><div class="ev">${carryValid}/20 <small class="dim">有效代理关闭</small></div><div class="es">总关闭 ${carryTotal} · 排除 ${carryExcluded} · 旧协议 open 隔离 ${pp.n_quarantined_total??0}；真实优势样本 ${pp.real_edge_n??carryEvidence?.real_edge_n??0}，仍不可判。</div><div class="meter"><i style="width:${Math.min(100,carryValid/20*100)}%"></i></div></div>
    <div class="evidence-card"><div class="ek"><span>数据全面性</span><span class="chip ${sourceOk===sourceHealth.length&&sourceHealth.length?'b-good':'b-warn'}">部分覆盖</span></div><div class="ev">${sourceOk}/${sourceHealth.length||'?'} <small class="dim">上币源可达</small></div><div class="es">覆盖不等于全面：链、交易所、地区限制与 API 失败都会制造盲区。</div><div class="meter"><i style="width:${sourceHealth.length?sourceOk/sourceHealth.length*100:0}%"></i></div></div>
  </section>`;
  // 1) EDGE
  h+='<div class="play-sec"><div class="ph">🧪 正在验证的结构候选 <span class="pd">尚无获证 edge · 纸面优先</span></div>';
  if(carry.length){
    h+=`<div class="pnote">当前验证的是<b>跨所资金费差</b>：空 HL + 多 OKX 两永续。当前输出是报价率积分减盘口报价与费用假设的描述性代理，不是实际结算或完整 PnL；有效代理关闭 <b>${carryValid}</b> / 总关闭 ${carryTotal}，旧协议 open 隔离 <b>${pp.n_quarantined_total??0}</b>，真实优势样本 <b>${pp.real_edge_n??carryEvidence?.real_edge_n??0}</b>。</div>`;
    h+=carry.slice(0,3).map(c=>`<div class="prow"><span class="chip b-accent">${esc(c.trade)}</span> <b>${esc(c.symbol)}</b> <span class="tag ${c.is_major?'b-good':'b-warn'}">${esc(c.tier)}</span> 部分模型代理 <span class="num" style="color:var(--accent-t)">+${c.partial_model_proxy_ann_pct}%/年</span> <small class="dim">毛资金费差 ${esc(c.gross_funding_diff_ann_pct)} · ${c.model_hold_days_assumption}d固定情景 · 持有期未验证 · 非仓位建议</small></div>`).join('');
  } else h+=`<div class="pnote dim">${carryHealth.state==="ok"?'本轮没有候选通过 Carry 入场门槛；不代表全市场没有机会。':'本轮 Carry 数据不完整，当前不可判。'}</div>`;
  h+='</div>';
  h+=carryLifecycleHtml(pp,3);
  // 2) DEFENSE
  h+='<div class="play-sec"><div class="ph">🛡️ 防守:别当接盘侠 <span class="pd">散户最持久的 edge 在这</span></div>';
  let any=false;
  if(dep.length){any=true;h+=`<div class="prow"><span class="chip b-danger">🔴 派发启动</span> ${dep.map(x=>esc(x.symbol)).join("、")} —— 操盘簇正往交易所转币(领先砸盘)→ <b>别买、别接飞刀</b>。</div>`;}
  if(avoid.length){any=true;h+=`<div class="prow"><span class="chip b-warn">🟠 有雷/高接盘险</span> ${avoid.slice(0,8).map(x=>esc(x.symbol||(x.token||'').slice(0,6))).join("、")} —— 避开。</div>`;}
  if(!any) h+='<div class="pnote dim">此刻无明确派发/避雷项。</div>';
  h+='</div>';
  // 3) DON'T
  h+='<div class="play-sec"><div class="ph">🚫 别做:顶刊实证的散户负EV陷阱</div><div class="pnote">跟 🐋 聪明钱买入去接盘 · 追 💎 早期扫描的币做多 · 买 💰 庄吸筹跟庄 · 裸做空高资金费。这些标签是让你<b>看清结构、别当接盘侠</b>,不是让你照着买。跟买吸筹:pump 后 ~18 秒见顶、跟随者胜率 48%&lt;50%、非 insider 负回报。</div></div>';
  // VERDICT
  h+=`<div class="play-verdict">今日总判:${carry.length?`有 <b>${carry.length}</b> 个部分模型代理为正的跨所 Carry 纸面候选`:'进攻端无跨所部分模型代理为正的候选'}，另有 ${singleVenueCarry.length} 个单所现货对冲观察项未进入双腿验证；<b>当前没有通过证据门的真 edge</b>。这个看板最大的价值是减少误判和接盘风险，不是保证暴富；没有获证打法时，不做也是一种打法。</div>`;
  return h+'</div>';
}

function carryHealthHtml(health){
  const state=["ok","partial","unavailable"].includes(health?.state)?health.state:"unavailable";
  const cfg=state==="ok"
    ?["数据源正常","b-good","本轮 HL 与 OKX 扫描正常；没有候选只代表本轮未过门槛，不代表全市场没有机会。"]
    :state==="partial"
      ?["数据源部分缺失","b-warn","缺失不会触发平仓，未知区间不累计资金费；本轮候选与证据只能作部分判断。"]
      :["数据源不可用","b-danger","本轮无法判断是否存在 Carry 候选；已有纸面仓位保持开启，未知区间不累计资金费。"];
  const hl=health?.hl||{}, okx=health?.okx||{}, paper=health?.paper||{};
  const okxCounts=`观测 ${okx.observed??0}/${okx.requested??0} · 不支持 ${okx.unsupported??0} · 失败 ${okx.request_failed??0}`;
  const okxGaps=`超时 ${okx.request_timeout??0} · 过期 ${okx.rate_stale??0} · 无效 ${okx.rate_invalid??0} · 超限 ${okx.request_cap??0}`;
  const storage=[health?.snapshot_store,health?.scorecard].filter(x=>x&&x.state!=="ok").map(x=>x.error_kind).filter(Boolean).join(" · ");
  return `<section class="carry-health ${state}" aria-label="Carry 数据源健康">
    <div class="carry-health-head"><span class="carry-health-title">Carry 可判定性</span><span class="chip ${cfg[1]}">${cfg[0]}</span></div>
    <div class="carry-health-copy">${cfg[2]}</div>
    <div class="carry-health-grid">
      <div class="health-cell"><span class="hk">Hyperliquid</span><span class="hv">${esc(hl.state||"未知")} · ${esc(hl.rows??0)} 行</span><span class="hs">${esc(hl.error_kind||"本轮市场快照")}</span></div>
      <div class="health-cell"><span class="hk">OKX 资金费</span><span class="hv">${esc(okx.state||"未知")} · ${esc(okxCounts)}</span><span class="hs">${esc(okxGaps)}</span></div>
      <div class="health-cell"><span class="hk">已有纸面仓观测</span><span class="hv">${esc(health?.open_observed??0)}/${esc(health?.open_requested??0)}</span><span class="hs">未观测仓位保持开启，不补算收益</span></div>
      <div class="health-cell"><span class="hk">纸面账本</span><span class="hv">${esc(paper.state||"未知")}</span><span class="hs">${esc(paper.error_kind||storage||"生命周期同步正常")}</span></div>
    </div></section>`;
}

function carryEvidenceHtml(pp,evidence,scorecard){
  const valid=Number.isFinite(pp?.n_proxy_closed)?pp.n_proxy_closed:(Number.isFinite(evidence?.n_proxy)?evidence.n_proxy:null);
  const total=Number.isFinite(pp?.n_closed_total)?pp.n_closed_total:valid;
  const excluded=Number.isFinite(pp?.n_closed_excluded)?pp.n_closed_excluded:(valid!=null&&total!=null?Math.max(0,total-valid):null);
  const reasons=Object.entries(pp?.excluded_by_reason||{});
  const reasonLabels={legacy_episode:"旧版本",market_missing_close:"市场缺失关闭",invalid_close_reason:"无效关闭原因",incomplete_book_quote_cost:"盘口报价不全",invalid_partial_cost_contract:"部分成本合同无效",incomplete_quote_rate_path:"报价率路径不全",exit_quote_outside_sla:"退出报价超时",unverified_observation_method:"旧观测接口",inconsistent_proxy_math:"代理数学不一致",invalid_hold_period:"持有跨度无效",missing_result:"结果缺失"};
  const reasonText=reasons.map(([k,v])=>`${reasonLabels[k]||k} ${v}`).join(" · ");
  let html=`<div class="sc-card muted"><span class="k">Carry 优势证据</span>
    <span class="v"><span class="num">${valid??"?"}/20</span><small>有效报价代理关闭</small></span>
    <span class="v"><span class="num">${total??"?"}</span><small>总关闭</small></span>
    <span class="v"><span class="num">${excluded??"?"}</span><small>排除，不进入优势判决</small></span>
    <span class="v"><span class="num">${pp?.real_edge_n??evidence?.real_edge_n??0}</span><small>真实优势样本 · 判决 ${esc(evidence?.edge_verdict||"不可判")}</small></span>
    ${reasonText?`<details class="evidence-reasons"><summary>查看排除原因</summary>${esc(reasonText)}</details>`:""}</div>`;
  if(scorecard?.verdict==="measured"){
    const proxy=scorecard.quoted_hl_funding_rate_proxy_ann;
    const positive=scorecard.positive_quote_fraction;
    html+=`<div class="sc-card muted"><span class="k">HL 报价费率快照代理 · 近${esc(scorecard.span_h)}h</span>
      <span class="v"><span class="num">${proxy==null?"—":`${proxy>0?"+":""}${esc(proxy)}%`}</span><small>报价费率年化代理</small></span>
      <span class="v"><span class="num">${positive==null?"—":`${esc((positive*100).toFixed(0))}%`}</span><small>快照为正占比</small></span>
      <span class="v"><span class="num">${scorecard.worst_quoted_rate_ann==null?"—":`${esc(scorecard.worst_quoted_rate_ann)}%`}</span><small>最差瞬时报价率</small></span>
      <span class="v"><small>不是双腿持仓收益、交易所结算或实盘 PnL</small></span></div>`;
  }else if(scorecard){
    html+=`<div class="sc-card muted"><span class="k">HL 报价费率快照代理</span><span class="v">不可判 <small>${esc(scorecard.note||scorecard.error_kind||"")}</small></span></div>`;
  }
  if(pp&&(pp.n_open||pp.n_closed_total||pp.n_exit_pending)){
    html+=`<div class="sc-card muted"><span class="k">纸面报价代理账本</span>
      <span class="v"><span class="num">${esc(pp.n_open??0)}</span><small>开启，含待报价 ${esc(pp.n_exit_pending??0)}</small></span>
      <span class="v"><span class="num">${esc(pp.new_entry_quote_attempted??"?")}/${esc(pp.new_entry_quote_cap??"?")}</span><small>本轮新入场盘口尝试 · 容量延后 ${esc(pp.new_entry_candidates_deferred??"?")}</small></span>
      <span class="v"><span class="num">${pp.avg_net_proxy_pct==null?"—":`${pp.avg_net_proxy_pct>0?"+":""}${esc(pp.avg_net_proxy_pct)}%`}</span><small>盘口+费用假设后的净代理</small></span>
      <span class="v"><span class="num">${pp.avg_quoted_rate_integral_pct==null?"—":`${esc(pp.avg_quoted_rate_integral_pct)}%`}</span><small>报价率积分代理，非实际结算</small></span>
      <span class="v"><span class="num">${pp.avg_book_and_modeled_fee_proxy_pct==null?"—":`${esc(pp.avg_book_and_modeled_fee_proxy_pct)}%`}</span><small>盘口与费用假设，非全量成本</small></span></div>`;
  }
  return html;
}

function carryLifecycleHtml(pp,limit=5){
  const rank=p=>p.status==="exit_pending"?0:["source_gap","migration_gap"].includes(p.measurement_state)?1:2;
  const openRows=[...(pp?.open_positions||[])].sort((a,b)=>rank(a)-rank(b)).slice(0,limit).map(p=>{
    const pending=p.status==="exit_pending";
    const gap=["source_gap","migration_gap"].includes(p.measurement_state);
    const label=pending?"退出待报价":gap?"数据缺口·保持开启":"纸面观测中";
    const cls=pending?"pending":gap?"gap":"";
    const chip=pending||gap?"b-warn":"b-accent";
    const lastValid=p.last_valid_at||p.last_measured_at;
    const rule=pending
      ?`有效配对差价已于 ${utcClock(p.exit_signal_at)} 触发退出（${p.exit_signal_diff_ann_pct==null?"—":esc(p.exit_signal_diff_ann_pct)+"%/年"}），但出口盘口缺失；保持开启，不伪造平仓、成本或净额。最近尝试 ${utcClock(p.last_attempt_at)}。`
      :gap
        ?`缺失不是退出；最近有效观测 ${utcClock(lastValid)}，最近尝试 ${utcClock(p.last_attempt_at)}，未知 ${esc(p.unmeasured_h??0)}h 不累计资金费。`
        :`只有有效 HL/OKX 配对差价低于 ${esc(p.exit_diff_floor_ann_pct)}%/年才触发退出；若出口盘口缺失则进入待报价。`;
    return `<article class="carry-life ${cls}"><div class="carry-life-head"><span class="chip ${chip}">${label}</span><b>${esc(p.symbol)}</b><span class="dim">${esc(p.measurement_state||"unknown")}</span></div>
      <div class="carry-life-grid">
        <div class="life-cell"><span class="lk">时间 UTC</span><span class="lv">入场 ${esc(utcClock(p.entry_at))}<br>最后有效 ${esc(utcClock(lastValid))}</span></div>
        <div class="life-cell"><span class="lk">配对差价</span><span class="lv">${esc(pct2(p.entry_diff_ann_pct))} → ${esc(pct2(p.last_diff_ann_pct))} %/年</span></div>
        <div class="life-cell"><span class="lk">盘口测量规模</span><span class="lv">每腿 ${usd(p.notional_usd_per_leg)}<br><small class="dim">不是仓位建议或可成交上限</small></span></div>
      </div><div class="life-rule">${rule}</div></article>`;
  }).join("");
  const closed=(pp?.recent||[]).slice(-limit).reverse().map(p=>`<article class="carry-life"><div class="carry-life-head"><span class="chip">有效报价代理关闭</span><b>${esc(p.symbol)}</b></div>
    <div class="carry-life-grid"><div class="life-cell"><span class="lk">时间 UTC</span><span class="lv">${esc(utcClock(p.entry_at))} → ${esc(utcClock(p.closed_at))}</span></div><div class="life-cell"><span class="lk">净报价代理</span><span class="lv">${p.net_proxy_pct==null?"—":`${p.net_proxy_pct>0?"+":""}${esc(p.net_proxy_pct)}%`}</span></div><div class="life-cell"><span class="lk">关闭原因</span><span class="lv">${esc(p.close_reason||"unknown")}</span></div></div><div class="life-rule">订单簿纸面报价代理，非实盘成交、实际资金费结算或完整收益。</div></article>`).join("");
  if(!openRows&&!closed)return "";
  return `<section class="play-sec" style="margin:11px 0 14px"><div class="ph">⏱ Carry 进入 / 离开生命周期 <span class="pd">UTC · 缺失不平仓 · 非实盘</span></div>${openRows}${closed}</section>`;
}

// perp: source health → open lifecycle → evidence → candidates → defensive structure
function renderPerp(d){
  const carry=d?.carry||[], s=d?.perps||[], cascadeEvents=d?.cascade_events||[];
  const carryEvidence=data.stats?.lanes?.carry, pp=d?.carry_paper||{}, health=d?.carry_source_health||{};
  const healthState=["ok","partial","unavailable"].includes(health.state)?health.state:"unavailable";
  let html=carryHealthHtml(health);
  html+=carryLifecycleHtml(pp);
  html+=carryEvidenceHtml(pp,carryEvidence,d?.carry_scorecard);

  if(carry.length){
    const rows=carry.slice(0,20).map(c=>{
      const flags=(c.flags||[]).filter(f=>!f.includes("ADL")).map(f=>`<span class="chip b-warn">${esc(f.split(":")[0].split("(")[0])}</span>`).join(" ")||'<span class="chip">无额外标签</span>';
      const struct=c.cross
        ?`<span class="num">HL ${c.sustained_ann>0?"+":""}${esc(c.sustained_ann)} · OKX ${c.okx_ann>0?"+":""}${esc(c.okx_ann)}</span>`
        :`<span class="num">HL ${c.sustained_ann>0?"+":""}${esc(c.sustained_ann)}%</span>`;
      const trade=c.cross?'<span class="chip b-accent">空HL·多OKX</span>':`<span class="chip">${esc((c.hedge||"").includes("HL")?"HL现货":"CEX现货")}</span>`;
      const proxy=c.partial_model_proxy_ann_pct;
      const netcol=proxy>0?`<span class="num" style="color:var(--accent-t);font-weight:650">+${esc(proxy)}%</span>`:`<span class="num" style="color:var(--danger)">${esc(proxy)}%</span>`;
      const coverage=c.cross?(c.coverage_point_count?`<small class="dim">${esc(c.model_hold_days_assumption)}d固定情景·持有期未验证<br>报价覆盖 ${esc(c.coverage_span_h)}h/${esc(c.coverage_point_count)}点</small>`:`<small class="dim">${esc(c.model_hold_days_assumption)}d固定情景·持有期未验证<br>报价覆盖积累中</small>`):'<small class="dim">单所观察·不进双腿账本</small>';
      return `<tr title="${esc(c.note)}"><td>${idc(c.symbol,c.tier)}</td><td class="n">${netcol}<small class="dim"> 毛资金费差 ${esc(c.gross_funding_diff_ann_pct)}</small></td><td class="n">${struct}</td><td>${trade}</td><td class="n">${coverage}</td><td>${flags}</td></tr>`;
    }).join("");
    const crossCount=carry.filter(c=>c.cross===true).length,singleCount=carry.length-crossCount;
    html+=`<div class="perp-sec">💰 Carry 候选 · 仅作纸面验证 <small>跨所双腿 ${crossCount} 个；单所现货对冲 ${singleCount} 个不进入双腿账本。部分模型只扣固定情景组件；basis、账户费率、抵押资金成本和调仓仍不完整，不能当作 all-in 净收益或仓位建议。</small></div>
      <div class="scroll"><div class="swipe-hint" aria-hidden="true">左右滑动查看更多 →</div><table class="tbl"><thead><tr><th>代币</th><th class="n">部分模型代理/年</th><th class="n">报价构成(HL/OKX)</th><th>纸面结构</th><th class="n">模型假设/报价覆盖</th><th>风险</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }else{
    html+=`<div class="empty">${healthState==="ok"?"本轮没有候选通过 Carry 入场门槛；这不代表全市场没有机会。":"本轮数据不完整，不能判断是否存在 Carry 候选。"}</div>`;
  }

  if(cascadeEvents.length){
    html+=`<div class="play-sec" style="margin:14px 0"><div class="ph">⚡ 已入账的级联/点火事件 <span class="pd">首次价已锁定 · 仅强触发</span></div>`+
      cascadeEvents.slice(0,4).map(e=>{const ed=effectiveDecision(e);const label=ed==='SMALL_PROBE'?esc(e.side):ed==='EXPIRED'?'已过期·历史方向 '+esc(e.side):'观察·历史方向 '+esc(e.side);return `<div class="prow"><span class="chip ${ed==='SMALL_PROBE'?(e.side==='SHORT'?'b-warn':'b-good'):ed==='EXPIRED'?'':'b-warn'}">${label}</span> <b>${esc(e.symbol)}</b> <span class="num">$${esc(e.entry_price)}</span> <small class="dim">${esc(expiryText(e))} · 失效 $${esc(e.invalidation_price)} · ≤${usd(e.max_notional_usd)} · 只读报价非成交 · ${esc(e.signal)}${e.actionability_reason?` · ${esc(e.actionability_reason)}`:''}</small><details class="cascade-evidence" data-chart-details><summary>查看入场 / 失效 / 结果时间线</summary>${eventEvidenceTimelineHtml(e)}${launchLifecycleHtml(e)}</details></div>`}).join("")+`</div>`;
  }
  if(s.length){
    const col=p=>{const fa=p.funding_ann;const a=Math.min(Math.abs(fa)/300,1);if(p.signal==="ignition")return{bg:`color-mix(in srgb,var(--good) ${20+a*30}%,var(--s1))`,b:"var(--good-b)"};return{bg:`color-mix(in srgb,var(--${fa>0?'danger':'warn'}) ${15+a*35}%,var(--s1))`,b:`var(--${fa>0?'danger':'warn'}-b)`}};
    html+=`<div class="perp-sec" style="margin-top:16px">🌡️ 拥挤 / 点火 <small>方向观测 · 判断你是不是站在被清算那侧 · 防御用，非买卖指令</small></div><div class="hm">`+s.map(p=>{const c=col(p);const lab=p.signal==="ignition"?(p.direction==="up"?"🔥点火↑":"🔥点火↓"):(p.direction==="longs_crowded"?"多头拥挤":"空头拥挤");const why=Array.isArray(p.why)?p.why.join(" · "):(p.why||"暂无更多解释");return `<div class="cell" style="background:${c.bg};border-color:${c.b}" tabindex="0" role="button" aria-expanded="false" aria-label="展开 ${esc(p.symbol)} 信号原因"><div class="sy">${esc(p.symbol)} <span class="chip">${lab}</span></div><div class="fu ${p.funding_ann>0?'down':'up'}">${p.funding_ann>0?'+':''}${p.funding_ann}%<small style="color:var(--dim)">/年</small></div><div class="mt">OI ${usd(p.oi_usd)} · 24h ${p.price_chg_24h!=null?(p.price_chg_24h>0?'+':'')+(+p.price_chg_24h).toFixed(1)+'%':'—'}</div><div class="cell-why" hidden>${esc(why)}</div></div>`}).join("")+`</div>`;
  }
  return html;
}

// ---------- paint ----------
function paint(){
  disposeEventCharts();eventChartRows.clear();eventChartSeq=0;
  const L=LANES[view], d=data[view==="avoid"?"opp":view];
  document.body.dataset.view=view;
  $("lanetitle").innerHTML=L.title(d);
  const st=(L.stat(d)||[]).slice();
  const ls=data.stats?.lanes?.[view];
  if(ls){
    if(view==="airdrop"&&ls){
      const full=ls.n_fully_verified_claims??0;
      st.push(["链上交易执行",ls.n_transaction_verified??0,"仅证明交易成功，不证明是本活动领取"]);
      st.push(["活动领取语义",ls.n_claim_semantics_verified??0,"已绑定活动，不等于奖励金额"]);
      st.push(["奖励已估值",ls.n_reward_valued??0,"金额已核验，仍不等于净回报"]);
      st.push(["完整奖励结算",full,"领取、受益人、奖励/USD 与实际成本全部核验"]);
      if(full>0&&Number.isFinite(ls.net_reward_usd)) st.push(["已核验净回报",usd(ls.net_reward_usd),`仅汇总 ${full} 笔完整领取`]);
      else st.push(["已核验净回报","不计入","尚无完整领取与成本证据"]);
      st.push(["优势结论","不可判","缺参与失败/资格未命中分母，不能判断是否有 edge"]);
    } else if(ls.verdict==="measured"){
      const measuredCost=ls.metric==="positive_after_estimated_cost";
      st.push([measuredCost?"24h成本后为正":"本线命中率",`${(ls.rate*100).toFixed(0)}%`,`${ls.hits}/${ls.n} Wilson[${(ls.lo*100).toFixed(0)}-${(ls.hi*100).toFixed(0)}%]`]);
      if(measuredCost) st.push(["24h净分布",`中位 ${ls.median_net_24h}%`,`P90 ${ls.p90_net_24h}% · P99 ${ls.p99_net_24h}% · 成本为估算,非实盘成交`]);
      if(ls.edge_verdict) st.push(["相对优势",ls.edge_verdict,ls.edge_note||""]);
      if(ls.base_rate!=null) st.push(["vs 基准率",`${(ls.base_rate*100).toFixed(0)}%`,`lift ${ls.lift} · ${ls.edge||''}`]);
    } else if(ls.verdict==="不可判") {const ev=ls.edge_validation;if(view==="launch"&&ev){const target=ev.state==="awaiting_outcomes"?(ev.look_n_per_arm||100):(ev.next_look_n_per_arm||ev.look_n_per_arm||100);st.push(["前向优势","不可判",`v5 SMALL_PROBE ${ev.eligible_n?.SMALL_PROBE||0}/${target} · WATCH ${ev.eligible_n?.WATCH||0}/${target} · ${ev.reason||""}`])}else st.push(["24h结果","不可判",`积累${ls.n}/20 · ${ls.edge_note||""}`]);} }
  $("lanestat").innerHTML=st.map(([k,v,s])=>`<div><span class="k">${k}</span><span class="v">${v}<small> ${s||''}</small></span></div>`).join("");
  $("rd").innerHTML=L.readme;
  $("view").innerHTML = view==="play"?renderPlay() : view==="perp"?renderPerp(d) : view==="launch"?renderLaunchCoverage(d)+renderTable(view,L.rows(d),L.cols,L) : (L.custom?"":renderTable(view, L.rows(d), L.cols, L));
  // counts
  for(const [k,l] of Object.entries(LANES)){const dd=data[k==="avoid"?"opp":k];const n=dd?(l.rows?l.rows(dd).length:0):0;const el=$("ct-"+k);if(el)el.textContent=n||""}
  document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.v===view;t.classList.toggle("on",on);t.setAttribute("aria-selected",String(on));t.tabIndex=on?0:-1});
  wireRows();
  staleness();
}
function wireRows(){
  document.querySelectorAll("[data-jump]").forEach(btn=>btn.onclick=()=>{setView(btn.dataset.jump);document.getElementById("tabs").scrollIntoView({behavior:"smooth",block:"start"})});
  document.querySelectorAll("[data-filter]").forEach(btn=>btn.onclick=()=>{filterState[view]=btn.dataset.filter;paint()});
  document.querySelectorAll(".search").forEach(input=>input.oninput=()=>{const value=input.value;searchState[view]=value;paint();const next=document.querySelector(".search");if(next){next.focus();next.setSelectionRange(value.length,value.length)}});
  document.querySelectorAll("tr[data-row][aria-controls]").forEach(tr=>{
    const toggle=()=>{const ex=document.getElementById(tr.getAttribute("aria-controls"));if(!ex)return;ex.hidden=!ex.hidden;tr.setAttribute("aria-expanded",String(!ex.hidden));if(!ex.hidden)requestAnimationFrame(()=>mountEventCharts(ex));else disposeEventCharts(ex)};
    tr.onclick=toggle;tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
  });
  document.querySelectorAll("details[data-chart-details]").forEach(item=>item.addEventListener("toggle",()=>{if(item.open)requestAnimationFrame(()=>mountEventCharts(item));else disposeEventCharts(item)}));
  document.querySelectorAll(".cell[aria-expanded]").forEach(cell=>{
    const toggle=()=>{const why=cell.querySelector(".cell-why");why.hidden=!why.hidden;cell.setAttribute("aria-expanded",String(!why.hidden))};
    cell.onclick=toggle;cell.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
  });
  document.querySelectorAll("th[data-col]").forEach(th=>{const c=LANES[view].cols?.find(x=>x.k===th.dataset.col);if(!c||!c.sort)return;
    const sort=()=>{const ss=sortState[view]||{};sortState[view]=ss.col===c.k?{col:c.k,dir:ss.dir==="desc"?"asc":"desc"}:{col:c.k,dir:"desc"};paint()};
    th.onclick=sort;th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();sort()}};
  });
}
function staleness(){
  // A synthesis page has several independent clocks. Name the stale or missing
  // lane instead of letting one slow legacy feed impersonate the whole site's age.
  const all=[["早期",data.launch],["结构",data.structure],["空投",data.airdrop],["永续",data.perp],["操盘",data.op],["旧版线索",data.opp],["钱包",data.watch],["证据",data.stats]];
  const selected=view==="play"?all:[[view==="avoid"?"风险过滤":view,data[view==="avoid"?"opp":view]]];
  const missing=selected.filter(([,d])=>!d).map(([name])=>name),now=Date.now(),el=$("live");
  el.title="这里只检查看板视图是否按时生成；上游市场源的覆盖与失败请看五赛道覆盖卡和各页源健康。";
  const available=selected.filter(([,d])=>d&&Number.isFinite(new Date(d.generated_at).getTime())).map(([name,d])=>{
    const gen=new Date(d.generated_at).getTime(),next=new Date(d.next_expected_at).getTime();
    const staleAfter=new Date(d.stale_after_at||next+15*6e4).getTime();
    return{name,d,gen,staleAfter};
  });
  if(!available.length){el.className="live dead";$("livet").textContent="无数据";$("gen").textContent=`缺失: ${missing.join("、")||"全部"}`;return}
  const newest=available.reduce((a,b)=>a.gen>b.gen?a:b),oldest=available.reduce((a,b)=>a.gen<b.gen?a:b);
  const stale=available.filter(x=>!Number.isFinite(x.staleAfter)||now>=x.staleAfter);
  $("gen").textContent=`最新 ${newest.name} ${relMs(newest.gen)} · 最老 ${oldest.name} ${relMs(oldest.gen)}${missing.length?` · 缺失 ${missing.join("、")}`:""}`;
  const bad=[...missing,...stale.map(x=>x.name)];
  if(!bad.length){el.className="live";$("livet").textContent=`LIVE · ${available.length}/${selected.length}视图按时`}
  else if(stale.some(x=>now-x.gen>=864e5)||missing.length){el.className="live dead";$("livet").textContent=`缺失/超期: ${bad.slice(0,2).join("、")}`}
  else{el.className="live stale";$("livet").textContent=`${bad.length}条陈旧: ${bad.slice(0,2).join("、")}`}
}

function setView(next,updateHash=true){
  if(!LANES[next])return;
  view=next;if(updateHash&&location.hash.slice(1)!==next)history.pushState(null,"","#"+next);paint();
}
const initialView=location.hash.slice(1);if(LANES[initialView])view=initialView;
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>setView(t.dataset.v);
  t.onkeydown=e=>{if(!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll(".tab")];let i=tabs.indexOf(t);if(e.key==="Home")i=0;else if(e.key==="End")i=tabs.length-1;else i=(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;setView(tabs[i].dataset.v);tabs[i].focus()};
});
addEventListener("popstate",()=>setView(location.hash.slice(1)||"play",false));
$("tgl").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const n=c==="light"?"dark":c==="dark"?"light":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("th",n)}catch(e){}};
try{const t=localStorage.getItem("th");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

// poll progress bar
let pt=0; setInterval(()=>{pt=(pt+1)%60;$("prog").style.width=(pt/60*100)+"%"},1000);

async function load(){
  const b="?t="+Math.floor(Date.now()/6e4);
  const r=await Promise.allSettled(["launch","structure","airdrop","watch","perps","opportunities","operators","stats"].map(v=>fetch("/data/"+v+".json"+b).then(x=>x.ok?x.json():null)));
  const [la,su,ad,wt,p,o,op,st]=r.map(x=>x.status==="fulfilled"?x.value:null);
  if(la&&la.schema_version===1)data.launch=la;
  if(su&&su.schema_version===1)data.structure=su;
  if(ad&&ad.schema_version===1)data.airdrop=ad;
  if(wt&&wt.schema_version===1)data.watch=wt;
  if(p&&p.schema_version===1)data.perp=p;
  if(o&&o.schema_version===1)data.opp=o;
  if(op&&op.schema_version===1)data.op=op;
  if(st&&st.schema_version===1)data.stats=st;
  lastPoll=Date.now(); pt=0;
  paint();
}
let launchLoading=false;
async function loadLaunch(){
  if(launchLoading)return; launchLoading=true;
  try{
    const b="?t="+Math.floor(Date.now()/5e3);
    const response=await fetch("/data/launch.json"+b,{cache:"no-store"});
    const launch=response.ok?await response.json():null;
    if(launch&&launch.schema_version===1){data.launch=launch;if(view==="launch"||view==="play")paint()}
  }catch(e){}finally{launchLoading=false}
}
$("view").innerHTML=`<div class="scroll">${'<div class="skl"></div>'.repeat(6)}</div>`;
load(); setInterval(load,6e4); setInterval(loadLaunch,1e4);
</script>
