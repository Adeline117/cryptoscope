<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>机会雷达 · Alpha Radar</title>
<style>
  :root{
    --bg:#080b10; --s1:#0f141c; --s2:#151b24; --s3:#1b2330; --s4:#232d3b;
    --border:#202a38; --border2:#334155;
    --text:#f5f7fa; --muted:#aeb8c6; --dim:#78869a;
    --accent:#3b82f6; --accent-t:#7db4ff; --accent-bg:#102341; --accent-b:#285796;
    --good:#71d083; --good-s:#46a758; --good-bg:#1b2a1e; --good-b:#366740;
    --danger:#ff977d; --danger-s:#e54d2e; --danger-bg:#391714; --danger-b:#853a2d;
    --warn:#ffca16; --warn-s:#ffc53d; --warn-bg:#302008; --warn-b:#714f19;
    --violet:#9b8cff; --violet-bg:#251e3e; --violet-b:#473876;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --row-h:48px; --shadow:0 18px 55px rgba(0,0,0,.22);
  }
  :root[data-theme="light"]{
    --bg:#f3f6fa; --s1:#fff; --s2:#f7f9fc; --s3:#eef3f8; --s4:#e3eaf2;
    --border:#dfe6ee; --border2:#cbd5e1; --text:#172033; --muted:#536174; --dim:#7b899c;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3; --shadow:0 18px 55px rgba(30,50,80,.09);
  }
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#f3f6fa; --s1:#fff; --s2:#f7f9fc; --s3:#eef3f8; --s4:#e3eaf2;
    --border:#dfe6ee; --border2:#cbd5e1; --text:#172033; --muted:#536174; --dim:#7b899c;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3; --shadow:0 18px 55px rgba(30,50,80,.09);}}
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable}
  body{margin:0;background:
    radial-gradient(circle at 10% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 34rem),
    radial-gradient(circle at 90% 0,color-mix(in srgb,var(--violet) 9%,transparent),transparent 30rem),var(--bg);
    color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1420px;margin:0 auto;padding:0 32px 72px}
  a{color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 14px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--accent),var(--violet));display:grid;place-items:center;
    font-weight:800;font-size:17px;color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
  h1{font-size:17px;font-weight:760;margin:0;letter-spacing:-.02em;line-height:1.25}
  h1 span{display:block;color:var(--dim);font-weight:500;font-size:11px;margin:3px 0 0;letter-spacing:.08em;text-transform:uppercase}
  .hr{display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--good-s);animation:pulse 2s infinite}
  .live.stale .pulse{background:var(--warn-s);animation:none}
  .live.dead .pulse{background:var(--danger-s);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,167,88,.5)}70%{box-shadow:0 0 0 6px rgba(70,167,88,0)}100%{box-shadow:0 0 0 0 rgba(70,167,88,0)}}
  .tgl{cursor:pointer;background:var(--s1);border:1px solid var(--border2);color:var(--muted);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:15px;transition:.18s ease}
  .tgl:hover{color:var(--text);transform:translateY(-1px);border-color:var(--accent)}
  .prog{height:2px;background:var(--accent);width:0;transition:width 1s linear;opacity:.7}

  /* tabs */
  .tabs{display:flex;gap:8px;margin:16px 0 0;overflow-x:auto;padding:4px;background:color-mix(in srgb,var(--s1) 85%,transparent);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .grp{display:flex;gap:4px;align-items:center}
  .grp+.grp{margin-left:4px;padding-left:8px;border-left:1px solid var(--border)}
  .tab{appearance:none;background:transparent;border:1px solid transparent;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:620;color:var(--muted);
    border-radius:9px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.16s ease}
  .tab:hover{color:var(--text);background:var(--s3)} .tab.on{color:var(--text);background:var(--s3);border-color:var(--border2);box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .tab .ct{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--s3);border-radius:999px;padding:1px 6px}
  .tab.on .ct{color:var(--accent-t);background:var(--accent-bg)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* lane head */
  .lanehead{display:grid;grid-template-columns:minmax(280px,1fr) minmax(420px,auto);align-items:center;gap:28px;margin:18px 0 12px;
    padding:22px 24px;background:linear-gradient(115deg,var(--s1),color-mix(in srgb,var(--s2) 84%,var(--accent-bg)));
    border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
  .lanetitle{font-size:16px;color:var(--muted);max-width:720px;line-height:1.55}
  .lanetitle b{color:var(--text)}
  .stat{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;justify-content:flex-end}
  .stat>div{min-width:118px;padding:2px 18px;border-left:1px solid var(--border)}
  .stat>div:first-child{border-left:0}
  .stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
  .stat .v{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:680;color:var(--text);line-height:1.25}
  .stat .v small{display:block;margin-top:3px;font-family:var(--sans);font-size:10.5px;color:var(--dim);font-weight:500;line-height:1.3;max-width:150px}
  details.readme{margin:0 0 16px;padding:0 4px}
  details.readme summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;user-select:none;display:inline-flex;align-items:center;gap:6px}
  details.readme summary::before{content:"▸";color:var(--dim)} details.readme[open] summary::before{content:"▾"}
  details.readme .rd{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--s1);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:11px 14px}
  details.readme .rd b{color:var(--text)}

  /* table */
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--s1);box-shadow:var(--shadow)}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:720px}
  .tbl th{position:sticky;top:0;z-index:2;background:var(--s2);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);text-align:left;padding:0 12px;height:34px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap}
  .tbl th.n{text-align:right} .tbl th.c{text-align:center}
  .tbl th.sortable::after{content:"↕";margin-left:5px;color:var(--dim);font-size:9px}
  .tbl th[aria-sort=ascending]::after{content:"▲";color:var(--accent-t)}
  .tbl th[aria-sort=descending]::after{content:"▼";color:var(--accent-t)}
  .tbl td{height:var(--row-h);padding:0 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  .tbl td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tbl td.c{text-align:center}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover td{background:color-mix(in srgb,var(--s3) 76%,var(--accent-bg))}
  .tbl tbody tr{cursor:pointer}
  .up{color:var(--good)} .down{color:var(--danger)} .flat{color:var(--dim)}
  .tbl tr.flash-up td{animation:fu 1s ease-out} .tbl tr.flash-down td{animation:fd 1s ease-out}
  @keyframes fu{from{background:rgba(70,167,88,.20)}to{background:transparent}}
  @keyframes fd{from{background:rgba(229,77,46,.20)}to{background:transparent}}

  /* identity cell */
  .idc{display:flex;align-items:center;gap:9px;min-width:0}
  .tk{width:26px;height:26px;border-radius:7px;background:var(--s3);border:1px solid var(--border2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;text-transform:uppercase}
  .idc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .idc .sub{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--s3);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-good{background:var(--good-bg);color:var(--good);border-color:var(--good-b)}
  .b-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-b)}
  .b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
  .b-violet{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-b)}
  .b-accent{background:var(--accent-bg);color:var(--accent-t);border-color:var(--accent-b)}
  .glyphs{display:inline-flex;gap:3px}
  .g{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700}
  .g.ok{background:var(--good-bg);color:var(--good)} .g.bad{background:var(--danger-bg);color:var(--danger)}
  .g.na{background:var(--s3);color:var(--dim)}
  .mtri{display:inline-flex;gap:6px;font-family:var(--mono);font-size:11px}
  .hero{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
  .bar{display:inline-block;height:5px;border-radius:3px;background:var(--accent);vertical-align:middle;min-width:2px}
  .exp td{background:var(--s2);padding:12px 14px;white-space:normal;font-size:12.5px;color:var(--muted);line-height:1.6}
  .exp b{color:var(--text)} .exp .so{color:var(--accent-t);font-weight:600}
  .empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:13px}
  .skl{height:var(--row-h);border-bottom:1px solid var(--border);background:linear-gradient(90deg,var(--s1) 25%,var(--s3) 50%,var(--s1) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* 📋 打法 synthesis */
  .play{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;max-width:none;border:0;background:transparent;box-shadow:none;overflow:visible}
  .play>.play-sec{grid-column:span 6}.play>.play-sec:first-child{grid-column:span 8}.play>.play-sec:nth-child(2){grid-column:span 4}
  .play-sec{border:1px solid var(--border);border-radius:14px;padding:20px 22px;background:var(--s1);box-shadow:var(--shadow)}
  .play-sec .ph{font-size:15px;font-weight:730;color:var(--text);display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .play-sec .ph .pd{font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.02em}
  .pnote{font-size:13.5px;line-height:1.7;color:var(--muted);margin:8px 0}
  .pnote.dim{color:var(--dim)}
  .prow{font-size:13px;line-height:1.55;padding:10px 0;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:7px;align-items:baseline}
  .prow:first-of-type{border-top:0}
  .prow .tag{font-size:10px;padding:1px 5px;border-radius:5px;font-weight:600}
  .prow .tag.b-good{background:var(--good-bg);color:var(--good)}
  .prow .tag.b-warn{background:var(--warn-bg);color:var(--warn)}
  .play-verdict{grid-column:span 6;border:1px solid var(--accent-b);border-radius:14px;padding:20px 22px;background:linear-gradient(135deg,var(--accent-bg),color-mix(in srgb,var(--violet-bg) 45%,var(--accent-bg)));font-size:14px;line-height:1.7;color:var(--text);box-shadow:var(--shadow)}
  /* perp: carry section header + heatmap */
  .perp-sec{font-size:12px;font-weight:650;color:var(--text);margin:2px 0 9px;letter-spacing:.02em}
  .perp-sec small{font-weight:500;color:var(--dim);letter-spacing:0}
  .sc-card{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;padding:10px 14px;margin:0 0 11px;
    background:var(--s1);border:1px solid var(--border);border-radius:10px}
  .sc-card .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sc-card .v{display:flex;gap:5px;align-items:baseline}
  .sc-card .v .num{font-size:16px;font-weight:650}
  .sc-card .v small{color:var(--dim);font-size:11px}
  .sc-card.muted .v{color:var(--dim);font-size:13px}
  .hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .cell{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--s1);display:flex;flex-direction:column;gap:5px;cursor:pointer}
  .cell .sy{font-weight:650;font-size:13px}
  .cell .fu{font-family:var(--mono);font-size:15px;font-weight:600}
  .cell .mt{font-size:10.5px;color:var(--muted)}
  .foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
  @media(max-width:980px){
    .wrap{padding:0 20px 56px}.lanehead{grid-template-columns:1fr;gap:18px}.stat{justify-content:flex-start}
    .stat>div:first-child{padding-left:0}.play>.play-sec,.play>.play-sec:first-child,.play>.play-sec:nth-child(2),.play-verdict{grid-column:1/-1}
  }
  @media(max-width:600px){
    body{font-size:14px}.wrap{padding:0 12px 44px}header{padding:12px 2px}.logo{width:36px;height:36px}.hr{gap:8px}
    h1 span{display:none}.live{font-size:10px}.tabs{margin-top:10px;border-radius:12px}.tab{padding:8px 10px}
    .lanehead{margin-top:12px;padding:18px 16px;border-radius:14px}.lanetitle{font-size:14px}.stat{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
    .stat>div{min-width:0;padding:6px 10px;border-left:1px solid var(--border)}.stat>div:nth-child(3n+1){border-left:0;padding-left:0}
    .stat .v{font-size:18px}.stat .v small{font-size:9.5px}.play{gap:12px}.play-sec,.play-verdict{padding:17px 16px}
    .play-sec .ph{align-items:flex-start;flex-direction:column;gap:2px}.scroll{border-radius:12px;margin-left:-1px;margin-right:-1px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">◎</div>
      <div><h1>CryptoScope 机会雷达<span>Evidence-first market intelligence</span></h1></div></div>
    <div class="hr">
      <span class="live" id="live"><span class="pulse"></span><span id="livet">LIVE</span></span>
      <button class="tgl" id="tgl" title="切换主题" aria-label="切换明暗主题">◐</button>
    </div>
  </header>
  <div class="prog" id="prog"></div>

  <div class="tabs" role="tablist" id="tabs">
    <div class="grp">
      <button class="tab on" data-v="play" role="tab">📋 打法</button>
    </div>
    <div class="grp">
      <button class="tab" data-v="launch" role="tab">🚀 Launch <span class="ct" id="ct-launch"></span></button>
      <button class="tab" data-v="structure" role="tab">🏗 结构 <span class="ct" id="ct-structure"></span></button>
      <button class="tab" data-v="airdrop" role="tab">🪂 空投 <span class="ct" id="ct-airdrop"></span></button>
      <button class="tab" data-v="watch" role="tab">🐋 钱包活动 <span class="ct" id="ct-watch"></span></button>
      <button class="tab" data-v="opp" role="tab">🔎 旧版线索 <span class="ct" id="ct-opp"></span></button>
      <button class="tab" data-v="avoid" role="tab">🛡️ 避雷 <span class="ct" id="ct-avoid"></span></button>
    </div>
    <div class="grp">
      <button class="tab" data-v="perp" role="tab">🔥 永续拥挤 <span class="ct" id="ct-perp"></span></button>
    </div>
    <div class="grp">
      <button class="tab" data-v="op" role="tab">🛡️ 操盘防御 <span class="ct" id="ct-op"></span></button>
    </div>
  </div>

  <div class="lanehead">
    <div class="lanetitle" id="lanetitle"></div>
    <div class="stat" id="lanestat"></div>
  </div>
  <details class="readme" id="readme"><summary>读我 · 这条线怎么用 / 诚实边界</summary><div class="rd" id="rd"></div></details>
  <div id="view"></div>

  <div class="foot"><span id="gen">—</span><span>各赛道按 2–60 分钟采集 · 页面每 60 秒读取最新快照 · 只是雷达不是买卖指令</span></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtUsd=n=>n==null?"—":(n=+n,Math.abs(n)>=1e6?(n/1e6).toFixed(2)+"M":Math.abs(n)>=1e3?Math.round(n/1e3)+"k":Math.round(n));
const usd=n=>n==null?"—":"$"+fmtUsd(n);
const pctc=n=>n==null?'<span class="flat">—</span>':`<span class="${n>0?'up':n<0?'down':'flat'}">${n>0?'+':''}${(+n).toFixed(n>=100||n<=-100?0:1)}%</span>`;
const short=a=>a?a.slice(0,4)+"…"+a.slice(-4):"—";
const ageStr=h=>h==null?"—":h<1/60?"<1m":h<1?Math.round(h*60)+"m":h<24?h.toFixed(1)+"h":Math.round(h/24)+"d";
function rel(ts){if(!ts)return"—";const s=Math.round(Date.now()/1000-ts);return s<5?"刚刚":s<60?s+"秒前":s<3600?Math.floor(s/60)+"分前":Math.floor(s/3600)+"时前"}
function relMs(t){const s=Math.round((Date.now()-t)/1000);return s<5?"刚刚":s<60?s+"s前":s<3600?Math.floor(s/60)+"分前":Math.floor(s/3600)+"时前"}
function effectiveDecision(r){
  const recorded=r?.recorded_decision||r?.decision||"WATCH";
  const expiry=r?.expires_at?new Date(r.expires_at).getTime():null;
  if(expiry&&Date.now()>=expiry&&["SMALL_PROBE","CLAIM_CHECK"].includes(recorded))return "EXPIRED";
  return r?.effective_decision||recorded;
}
function expiryText(r){
  if(!r?.expires_at)return "无有效报价时钟";
  const seconds=Math.ceil((new Date(r.expires_at).getTime()-Date.now())/1000);
  if(seconds<=0)return "已过期";
  return seconds<60?`剩 ${seconds}s`:`剩 ${Math.ceil(seconds/60)}m`;
}
function utcClock(ts){
  if(!ts)return "—";
  const d=new Date(ts); if(Number.isNaN(d.getTime()))return "—";
  return d.toISOString().replace("T"," ").replace(/\.\d{3}Z$/," UTC");
}
function launchLifecycleHtml(r){
  const detected=new Date(r?.detected_at||"");
  const horizons=r?.outcome?.horizons||{};
  const unavailable=new Set(r?.outcome?.unavailable_horizons||[]);
  const clocks=[["1h",1],["24h",24],["7d",168]].map(([name,hours])=>{
    const target=Number.isNaN(detected.getTime())?null:new Date(detected.getTime()+hours*3600000);
    const point=horizons[name];
    let result;
    if(point){
      const net=point.net_return_pct_est;
      const gross=point.gross_return_pct;
      result=`$${esc(point.price??"—")} · 毛收益 ${gross==null?"—":`${gross>0?"+":""}${esc(gross)}%`} · 估算成本后 ${net==null?"—":`${net>0?"+":""}${esc(net)}%`}`;
    }else if(unavailable.has(name)) result="历史价格不可得";
    else if(target&&Date.now()<target.getTime()) result=`等待到 ${esc(utcClock(target.toISOString()))}`;
    else result="已到评估时点，等待结算器回写";
    return `<div><b>${name}</b> · ${target?esc(utcClock(target.toISOString())):"时钟不可用"} · ${result}</div>`;
  }).join("");
  const quote=r?.quote_at&&r?.expires_at
    ?`${esc(utcClock(r.quote_at))} → ${esc(utcClock(r.expires_at))}（${esc(expiryText(r))}）`
    :"无完整双向报价时钟，不可按首次价行动";
  return `<br><b>进入窗口</b>: ${quote}<br><b>价格失效</b>: 若用户自行建仓，价格 ≤ $${esc(r?.invalidation_price??"—")} 时论文失效；系统不会代为卖出。<br><b>固定评估（不是平仓）</b>: ${clocks}<small>收益扣除冻结的估算成本；真实成交成本标记: ${r?.outcome?.cost_is_real_fill===true?"真实":"非真实成交"}。</small><br><b>真实离场</b>: 无——系统没有成交、没有持仓，也不会自动平仓。`;
}

let sortState={};   // per-lane {col, dir}

// ---------- generic table renderer ----------
function renderTable(laneId, rows, cols, cfg){
  if(!rows||!rows.length) return `<div class="scroll"><div class="empty">${cfg.empty||"这轮没有信号 —— 好机会本就稀疏,不是坏了。"}</div></div>`;
  // sort
  const ss=sortState[laneId];
  if(ss){const c=cols.find(x=>x.k===ss.col); if(c&&c.sort){rows=rows.slice().sort((a,b)=>{const x=c.sort(a),y=c.sort(b);const r=(x>y?1:x<y?-1:0);return ss.dir==="asc"?r:-r})}}
  const head=cols.map(c=>`<th class="${c.n?'n':c.c?'c':''} ${c.sort?'sortable':''}" data-col="${c.k}" ${ss&&ss.col===c.k?`aria-sort="${ss.dir==='asc'?'ascending':'descending'}"`:''}>${c.label}</th>`).join("");
  const prev=prevKey[laneId]||{};
  const cur={};
  const body=rows.map((r,i)=>{
    const id=cfg.id(r); const hv=cfg.flash?cfg.flash(r):null; if(hv!=null)cur[id]=hv;
    let fc=""; if(hv!=null&&prev[id]!=null&&prev[id]!==hv)fc=hv>prev[id]?"flash-up":"flash-down";
    const tds=cols.map(c=>`<td class="${c.n?'n':c.c?'c':''}">${c.cell(r)}</td>`).join("");
    const det=cfg.detail?`<tr class="exp" data-exp="${id}" hidden><td colspan="${cols.length}">${cfg.detail(r)}</td></tr>`:"";
    return `<tr class="${fc}" data-row="${id}" data-i="${i}">${tds}</tr>${det}`;
  }).join("");
  prevKey[laneId]=cur;
  return `<div class="scroll"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function avoidRows(d){return (d?.opportunities||[]).filter(o=>["avoid","caution"].includes(o.rug?.level)||["moderate","severe"].includes(o.manipulation?.level)||o.exit_risk?.level==="high")
  .sort((a,b)=>{const sev=x=>(x.rug?.level==="avoid"?3:0)+(x.manipulation?.level==="severe"?3:x.manipulation?.level==="moderate"?1:0)+(x.exit_risk?.level==="high"?2:0);return sev(b)-sev(a)})}

// operator classifier
const OPMAP={dump:{label:"正在出货",b:"danger",so:"对手盘可能是操盘簇，别接飞刀；只用于避开，不生成做空指令。"},armed:{label:"庄在场·待动",b:"warn",so:"盯着等它出手,现在不是买卖点。"},accum:{label:"疑似吸筹",b:"warn",so:"别跟买——跟庄吸筹对散户是负EV,且这「吸筹」可能是庄的wash farm诱饵。当观察,不当买入信号。"},issuer:{label:"项目方持币",b:"violet",so:"别当妖币,防的是团队解锁砸盘。"},faded:{label:"庄已走·散",b:"",so:"当普通币看。"},unknown:{label:"查不清",b:"accent",so:"数据不足,别信这条。"}};
const OPRANK={dump:0,armed:1,accum:2,issuer:3,faded:4,unknown:5};
// live 'deposit' event = operator cluster moving inventory to a CEX right now (leading
// dump signal). Fresh only (flow scan within 3h) so a stale phase isn't shown as live.
function depNow(r){return r&&r.live_phase==="deposit"&&r.flow_scan_ts&&(Date.now()-new Date(r.flow_scan_ts).getTime()<3*3600*1000)?1:0}
function classOp(r){if(!r.ok)return"unknown";const v=r.verdict||"",a=r.acquisition||"";if(a==="allocated")return"issuer";if(["distributing","exited_by_selling","present_rotating_confirmed","distributing_or_churn"].includes(v))return((r.largest_entity_pct||0)<5&&(r.dominant_wallets||0)<=1)?"faded":"dump";if(v==="loaded_accumulating")return"accum";if(["loaded_live_operator","live_operator"].includes(v))return(r.current_graph_available&&(r.largest_entity_pct||0)<2)?"unknown":"armed";if(v==="loaded_dormant")return"armed";if(["dispersed","treasury","treasury_only"].includes(v))return"faded";return"unknown"}

// 📋 打法 — the synthesis: what to consider, what to avoid, what NOT to do. Turns the
// board from a data dashboard into a clear, honest, ranked trading thesis.
function renderPlay(){
  const carry=(data.perp?.carry||[]).filter(x=>x.net_ann>0);
  const pp=data.perp?.carry_paper;
  const carryEvidence=data.stats?.lanes?.carry;
  const dep=(data.op?.operators||[]).filter(depNow);
  const avoid=avoidRows(data.opp);
  let h='<div class="scroll play">';
  // 1) EDGE
  h+='<div class="play-sec"><div class="ph">🧪 正在验证的结构候选 <span class="pd">尚无获证 edge · 纸面优先</span></div>';
  if(carry.length){
    h+=`<div class="pnote">当前最值得验证的假设是<b>跨所资金费差</b>：空HL + 多OKX 两永续，delta 中性不赌方向。模型净额不等于已实现收益；当前纸面成本后为正 <b>${carryEvidence?.hits??"?"}/${carryEvidence?.n??"?"}</b>，判决 <b>${esc(carryEvidence?.edge_verdict||"不可判")}</b>。</div>`;
    h+=carry.slice(0,3).map(c=>`<div class="prow"><span class="chip b-accent">${esc(c.trade)}</span> <b>${esc(c.symbol)}</b> <span class="tag ${c.is_major?'b-good':'b-warn'}">${esc(c.tier)}</span> 净 <span class="num" style="color:var(--good)">+${c.net_ann}%/年</span> <small class="dim">毛${c.edge_ann} · ${c.hold_measured?c.hold_days+'d实测':'持仓未测(14d假设)'} · 尾部ADL</small></div>`).join('');
    if(pp&&(pp.n_open||pp.n_closed)) h+=`<div class="pnote">📊 纸面验证:${pp.n_closed&&pp.avg_net_return_pct!=null?`已平仓 ${pp.n_closed} 个,<b>绝对净收益 ${pp.avg_net_return_pct>0?'+':''}${pp.avg_net_return_pct}%</b>(累计资金费 ${pp.avg_funding_accrued_pct}%,成本 ${pp.avg_cost_pct}%,持仓 ${pp.avg_hold_days}d${pp.avg_annualized_net_pct!=null?`,合格长样本年化 ${pp.avg_annualized_net_pct}%`:`,${esc(pp.annualized_note||'年化样本不足')}`})`:`${pp.n_open} 仓运行中,等差价衰减自然平仓→给实测数字。<b>在此之前净额是模型估,别当已证</b>`}。</div>`;
    if(pp?.open_positions?.length) h+=pp.open_positions.slice(0,3).map(p=>`<div class="prow"><span class="chip">纸面运行中</span> <b>${esc(p.symbol)}</b> 入场 <span class="num">${esc(utcClock(p.entry_at))}</span> · 最近测量 <span class="num">${esc(utcClock(p.last_measured_at))}</span> · 当前差价 <span class="num">${p.last_diff_ann_pct==null?'—':esc(p.last_diff_ann_pct)+'%/年'}</span><small class="dim">退出:差价&lt;${esc(p.exit_diff_floor_ann_pct)}%/年或市场缺失 · 非实盘</small></div>`).join('');
  } else h+='<div class="pnote dim">此刻无净&gt;0 的跨所 carry 机会。没有就没有,不硬凑一个给你。</div>';
  h+='</div>';
  // 2) DEFENSE
  h+='<div class="play-sec"><div class="ph">🛡️ 防守:别当接盘侠 <span class="pd">散户最持久的 edge 在这</span></div>';
  let any=false;
  if(dep.length){any=true;h+=`<div class="prow"><span class="chip b-danger">🔴 派发启动</span> ${dep.map(x=>esc(x.symbol)).join("、")} —— 操盘簇正往交易所转币(领先砸盘)→ <b>别买、别接飞刀</b>。</div>`;}
  if(avoid.length){any=true;h+=`<div class="prow"><span class="chip b-warn">🟠 有雷/高接盘险</span> ${avoid.slice(0,8).map(x=>esc(x.symbol||(x.token||'').slice(0,6))).join("、")} —— 避开。</div>`;}
  if(!any) h+='<div class="pnote dim">此刻无明确派发/避雷项。</div>';
  h+='</div>';
  // 3) DON'T
  h+='<div class="play-sec"><div class="ph">🚫 别做:顶刊实证的散户负EV陷阱</div><div class="pnote">跟 🐋 聪明钱买入去接盘 · 追 💎 早期扫描的币做多 · 买 💰 庄吸筹跟庄 · 裸做空高资金费。这些标签是让你<b>看清结构、别当接盘侠</b>,不是让你照着买。跟买吸筹:pump 后 ~18 秒见顶、跟随者胜率 48%&lt;50%、非 insider 负回报。</div></div>';
  // VERDICT
  h+=`<div class="play-verdict">今日总判:${carry.length?`有 <b>${carry.length}</b> 个模型净额为正的跨所 carry 纸面候选`:'进攻端无模型净额为正的候选'}，但<b>当前没有通过证据门的真 edge</b>。这个看板最大的价值是帮你不亏、不当接盘，不是保证暴富；没有获证打法时，不做也是一种打法。</div>`;
  return h+'</div>';
}

// perp: carry screener (the real edge, on top) + crowding/ignition heatmap (defense, below)
function renderPerp(d){
  const carry=d?.carry||[], s=d?.perps||[];
  const cascadeEvents=d?.cascade_events||[];
  const carryEvidence=data.stats?.lanes?.carry;
  if(!carry.length && !s.length && !cascadeEvents.length) return `<div class="scroll"><div class="empty">当前无正资金费机会,市场杠杆也不拥挤 —— 这本身是个信息。</div></div>`;
  let html="";
  if(cascadeEvents.length){
    html+=`<div class="play-sec" style="margin-bottom:14px"><div class="ph">⚡ 已入账的级联/点火事件 <span class="pd">首次价已锁定 · 仅强触发</span></div>`+
      cascadeEvents.slice(0,4).map(e=>{const ed=effectiveDecision(e);const label=ed==='SMALL_PROBE'?esc(e.side):ed==='EXPIRED'?'已过期·历史方向 '+esc(e.side):'观察·历史方向 '+esc(e.side);return `<div class="prow"><span class="chip ${ed==='SMALL_PROBE'?(e.side==='SHORT'?'b-warn':'b-good'):ed==='EXPIRED'?'':'b-warn'}">${label}</span> <b>${esc(e.symbol)}</b> <span class="num">$${esc(e.entry_price)}</span> <small class="dim">${esc(expiryText(e))} · 失效 $${esc(e.invalidation_price)} · ≤${usd(e.max_notional_usd)} · 只读报价非成交 · ${esc(e.signal)}${e.actionability_reason?` · ${esc(e.actionability_reason)}`:''}</small>${launchLifecycleHtml(e)}</div>`}).join("")+`</div>`;
  }
  // ── CARRY: delta-neutral funding arbitrage — the ONE replicable positive-EV core ──
  if(carry.length){
    const rows=carry.slice(0,20).map(c=>{
      const pf=c.pos_frac;
      const flags=c.flags.filter(f=>!f.includes("ADL")).map(f=>`<span class="chip b-warn">${esc(f.split(":")[0].split("(")[0])}</span>`).join(" ")||'<span class="chip b-good">干净</span>';
      // structure: cross-venue two-perp (HL vs OKX) or single-venue spot hedge
      const struct=c.cross
        ?`<span class="num">HL <span style="color:var(--good)">+${c.sustained_ann}</span> · OKX <span style="color:${c.okx_ann>0?'var(--good)':'var(--danger)'}">${c.okx_ann>0?'+':''}${c.okx_ann}</span></span>`
        :`<span class="num" style="color:var(--good)">HL +${c.sustained_ann}%</span>`;
      const trade=c.cross?'<span class="chip b-accent">空HL·多OKX</span>':`<span class="chip b-good">${esc(c.hedge.includes("HL")?"HL现货":"CEX现货")}</span>`;
      // NET is the honest headline (gross − amortized costs − rebalance). Gross secondary.
      const netcol=c.net_ann>0
        ?`<span class="num" style="color:var(--good);font-weight:650">+${c.net_ann}%</span>`
        :`<span class="num" style="color:var(--danger)">${c.net_ann}%</span>`;
      const hold=c.cross?(c.hold_measured?`<span class="num">${c.hold_days}d</span><small class="dim"> 实测</small>`:`<small class="dim">14d假设·未测</small>`):'<small class="dim">—</small>';
      return `<tr title="${esc(c.note)}">
        <td>${idc(c.symbol,c.tier)}</td>
        <td class="n">${netcol}<small class="dim"> 毛${c.edge_ann}</small></td>
        <td class="n">${struct}</td>
        <td>${trade}</td>
        <td class="n">${hold}</td>
        <td>${flags}</td></tr>`}).join("");
    const sc=d?.carry_scorecard;
    let scBanner=`<div class="sc-card muted"><span class="k">Carry 优势证据</span><span class="v">${esc(carryEvidence?.edge_verdict||"不可判")} <small>成本后纸面为正 ${carryEvidence?.hits??"?"}/${carryEvidence?.n??"?"} · 最小样本20 · 非实盘</small></span></div>`;
    if(sc){ if(sc.verdict==="measured"){
        scBanner+=`<div class="sc-card"><span class="k">主流carry费率历史·近${sc.span_h}h</span>
          <span class="v"><span class="num" style="color:var(--good)">+${sc.realized_ann}%</span><small>已实现年化(毛)</small></span>
          <span class="v"><span class="num">${(sc.pos_frac*100).toFixed(0)}%</span><small>时间正费</small></span>
          <span class="v"><span class="num" style="color:var(--danger)">${sc.worst_ann}%</span><small>最差瞬时</small></span></div>`;
      } else scBanner+=`<div class="sc-card muted"><span class="k">主流carry费率历史</span><span class="v">不可判 <small>${esc(sc.note||'')}</small></span></div>`; }
    // paper-trade tracker: MEASURED hold_days + real slippage + realized-vs-predicted net
    const pp=d?.carry_paper; let ppBanner="";
    if(pp&&(pp.n_open||pp.n_closed)){
      if(pp.n_closed&&pp.avg_net_return_pct!=null){
        ppBanner=`<div class="sc-card"><span class="k">纸面实测·${pp.n_closed}个已平仓</span>
          <span class="v"><span class="num" style="color:${pp.avg_net_return_pct>0?'var(--good)':'var(--danger)'}">${pp.avg_net_return_pct>0?'+':''}${pp.avg_net_return_pct}%</span><small>绝对净收益</small></span>
          <span class="v"><span class="num">${pp.avg_funding_accrued_pct}%</span><small>累计资金费</small></span>
          <span class="v"><span class="num" style="color:var(--danger)">${pp.avg_cost_pct}%</span><small>测得纸面成本·非成交</small></span>
          <span class="v"><span class="num">${pp.avg_hold_days}d</span><small>实测持仓</small></span>
          <span class="v"><span class="num dim">${pp.avg_annualized_net_pct!=null?pp.avg_annualized_net_pct+'%':'隐藏'}</span><small>${pp.avg_annualized_net_pct!=null?'长样本年化':esc(pp.annualized_note||'年化样本不足')}</small></span>
          <span class="v"><span class="num dim">${pp.n_open}</span><small>运行中</small></span></div>`;
      } else ppBanner=`<div class="sc-card muted"><span class="k">纸面追踪(实测持仓/滑点/净额)</span><span class="v">${pp.n_open}仓运行中·0平仓 <small>等差价衰减自然平仓→给真实持仓天数和净额,替掉假设</small></span></div>`;
    }
    let lifecycle="";
    if(pp?.open_positions?.length||pp?.recent?.length){
      const opens=(pp.open_positions||[]).slice(0,5).map(p=>`<div class="prow"><span class="chip b-accent">纸面 OPEN</span> <b>${esc(p.symbol)}</b> <span class="num">入场 ${esc(utcClock(p.entry_at))}</span> · <span class="num">最近 ${esc(utcClock(p.last_measured_at))}</span> · 差价 <span class="num">${p.entry_diff_ann_pct==null?'—':esc(p.entry_diff_ann_pct)} → ${p.last_diff_ann_pct==null?'—':esc(p.last_diff_ann_pct)}%/年</span> · 单腿 ${usd(p.notional_usd_per_leg)} <small class="dim">退出条件:差价&lt;${esc(p.exit_diff_floor_ann_pct)}%/年或市场缺失 · 只读盘口纸面测量</small></div>`).join("");
      const closed=(pp.recent||[]).slice(-5).reverse().map(p=>`<div class="prow"><span class="chip">纸面 CLOSED</span> <b>${esc(p.symbol)}</b> <span class="num">入场 ${esc(utcClock(p.entry_at))}</span> · <span class="num">离场 ${esc(utcClock(p.closed_at))}</span> · 净 <span class="num ${p.net_return_pct>0?'up':'down'}">${p.net_return_pct>0?'+':''}${esc(p.net_return_pct)}%</span> <small class="dim">${esc(p.close_reason||'unknown')} · 非实盘成交</small></div>`).join("");
      lifecycle=`<div class="play-sec" style="margin:11px 0 14px"><div class="ph">⏱ Carry 进入 / 离开生命周期 <span class="pd">UTC · 纸面盘口测量 · 非实盘</span></div>${opens}${closed}</div>`;
    }
    html+=`<div class="perp-sec">💰 跨所资金费套利 · delta中性 <small>空HL+多OKX两永续吃差价,不需现货 · <b>净额=毛差 − 往返成本(~0.35%按持仓天数摊)− 再平衡~1.5%/年</b>,这才是真数 · 扣完成本多数机会薄甚至负 · 尾部=ADL级联(为崩盘sizing)</small></div>
      ${scBanner}${ppBanner}${lifecycle}
      <div class="scroll"><table class="tbl"><thead><tr>
        <th>代币</th><th class="n">模型净额/年</th><th class="n">构成(HL/OKX)</th><th>纸面结构</th><th class="n">持仓/摊销</th><th>风险</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  // ── CROWDING / IGNITION: directional observation — defensive, not a trade button ──
  if(s.length){
    const col=p=>{const fa=p.funding_ann;const a=Math.min(Math.abs(fa)/300,1);
      if(p.signal==="ignition")return{bg:`color-mix(in srgb,var(--good) ${20+a*30}%,var(--s1))`,b:"var(--good-b)"};
      return{bg:`color-mix(in srgb,var(--${fa>0?'danger':'warn'}) ${15+a*35}%,var(--s1))`,b:`var(--${fa>0?'danger':'warn'}-b)`}};
    html+=`<div class="perp-sec" style="margin-top:16px">🌡️ 拥挤 / 点火 <small>方向观测 · 判断你是不是站在被清算那侧 · 防御用,非买卖指令</small></div>
      <div class="hm">`+s.map(p=>{const c=col(p);const lab=p.signal==="ignition"?(p.direction==="up"?"🔥点火↑":"🔥点火↓"):(p.direction==="longs_crowded"?"多头拥挤":"空头拥挤");
      return `<div class="cell" style="background:${c.bg};border-color:${c.b}" data-perp='${esc(JSON.stringify(p.why))}'>
        <div class="sy">${esc(p.symbol)} <span class="chip">${lab}</span></div>
        <div class="fu ${p.funding_ann>0?'down':'up'}">${p.funding_ann>0?'+':''}${p.funding_ann}%<small style="color:var(--dim)">/年</small></div>
        <div class="mt">OI ${usd(p.oi_usd)} · 24h ${p.price_chg_24h!=null?(p.price_chg_24h>0?'+':'')+(+p.price_chg_24h).toFixed(1)+'%':'—'}</div>
      </div>`}).join("")+`</div>`;
  }
  return html;
}

// ---------- paint ----------
function paint(){
  const L=LANES[view], d=data[view==="avoid"?"opp":view];
  $("lanetitle").innerHTML=L.title(d);
  const st=(L.stat(d)||[]).slice();
  const ls=data.stats?.lanes?.[view];
  if(ls){ if(ls.verdict==="measured"){
      const measuredCost=ls.metric==="positive_after_estimated_cost";
      st.push([measuredCost?"24h成本后为正":"本线命中率",`${(ls.rate*100).toFixed(0)}%`,`${ls.hits}/${ls.n} Wilson[${(ls.lo*100).toFixed(0)}-${(ls.hi*100).toFixed(0)}%]`]);
      if(measuredCost) st.push(["24h净分布",`中位 ${ls.median_net_24h}%`,`P90 ${ls.p90_net_24h}% · P99 ${ls.p99_net_24h}% · 成本为估算,非实盘成交`]);
      if(ls.edge_verdict) st.push(["相对优势",ls.edge_verdict,ls.edge_note||""]);
      if(ls.base_rate!=null) st.push(["vs 基准率",`${(ls.base_rate*100).toFixed(0)}%`,`lift ${ls.lift} · ${ls.edge||''}`]);
    } else if(ls.verdict==="不可判") st.push(["24h结果","不可判",`积累${ls.n}/20 · ${ls.edge_note||""}`]); }
  $("lanestat").innerHTML=st.map(([k,v,s])=>`<div><span class="k">${k}</span><span class="v">${v}<small> ${s||''}</small></span></div>`).join("");
  $("rd").innerHTML=L.readme;
  $("view").innerHTML = view==="play"?renderPlay() : view==="perp"?renderPerp(d) : (L.custom?"":renderTable(view, L.rows(d), L.cols, L));
  // counts
  for(const [k,l] of Object.entries(LANES)){const dd=data[k==="avoid"?"opp":k];const n=dd?(l.rows?l.rows(dd).length:0):0;const el=$("ct-"+k);if(el)el.textContent=n||""}
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===view));
  wireRows();
  staleness();
}
function wireRows(){
  document.querySelectorAll("tr[data-row]").forEach(tr=>tr.onclick=()=>{
    const ex=document.querySelector(`tr.exp[data-exp="${tr.dataset.row}"]`); if(ex)ex.hidden=!ex.hidden;});
  document.querySelectorAll("th[data-col]").forEach(th=>{const c=LANES[view].cols?.find(x=>x.k===th.dataset.col);if(!c||!c.sort)return;
    th.onclick=()=>{const ss=sortState[view]||{};sortState[view]=ss.col===c.k?{col:c.k,dir:ss.dir==="desc"?"asc":"desc"}:{col:c.k,dir:"desc"};paint()}});
}
function staleness(){
  // The synthesis page has no endpoint of its own.  Its freshness is only as good
  // as its stalest loaded input, so do not accidentally show "无数据" just because
  // `data.play` does not exist.
  const sources=view==="play"
    ?[data.launch,data.structure,data.airdrop,data.perp,data.op,data.opp,data.watch].filter(Boolean)
    :[data[view==="avoid"?"opp":view]].filter(Boolean);
  const d=sources.sort((a,b)=>new Date(a.generated_at)-new Date(b.generated_at))[0], el=$("live");
  if(!d){el.className="live dead";$("livet").textContent="无数据";return}
  const gen=new Date(d.generated_at).getTime(), next=new Date(d.next_expected_at).getTime();
  const staleAfter=new Date(d.stale_after_at||next+15*6e4).getTime(), now=Date.now();
  $("gen").textContent="数据更新于 "+relMs(gen);
  if(now<staleAfter){el.className="live";$("livet").textContent="LIVE · "+relMs(gen)}
  else if(now-gen<864e5){el.className="live stale";$("livet").textContent="陈旧 "+relMs(gen)}
  else{el.className="live dead";$("livet").textContent="超24h,别信"}
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.v;paint()});
$("tgl").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const n=c==="light"?"dark":c==="dark"?"light":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("th",n)}catch(e){}};
try{const t=localStorage.getItem("th");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

// poll progress bar
let pt=0; setInterval(()=>{pt=(pt+1)%60;$("prog").style.width=(pt/60*100)+"%"},1000);

async function load(){
  const b="?t="+Math.floor(Date.now()/6e4);
  const r=await Promise.allSettled(["launch","structure","airdrop","watch","perps","opportunities","operators","stats"].map(v=>fetch("/data/"+v+".json"+b).then(x=>x.ok?x.json():null)));
  const [la,su,ad,wt,p,o,op,st]=r.map(x=>x.status==="fulfilled"?x.value:null);
  if(la&&la.schema_version===1)data.launch=la;
  if(su&&su.schema_version===1)data.structure=su;
  if(ad&&ad.schema_version===1)data.airdrop=ad;
  if(wt&&wt.schema_version===1)data.watch=wt;
  if(p&&p.schema_version===1)data.perp=p;
  if(o&&o.schema_version===1)data.opp=o;
  if(op&&op.schema_version===1)data.op=op;
  if(st&&st.schema_version===1)data.stats=st;
  lastPoll=Date.now(); pt=0;
  paint();
}
$("view").innerHTML=`<div class="scroll">${'<div class="skl"></div>'.repeat(6)}</div>`;
load(); setInterval(load,6e4);
</script>
