<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>机会雷达 · Alpha Radar</title>
<style>
  :root{
    --bg:#0d0e10; --s1:#111113; --s2:#18191b; --s3:#212225; --s4:#272a2d;
    --border:#262a2e; --border2:#363a3f;
    --text:#edeef0; --muted:#b0b4ba; --dim:#777b84;
    --accent:#0090ff; --accent-t:#70b8ff; --accent-bg:#0d2847; --accent-b:#205d9e;
    --good:#71d083; --good-s:#46a758; --good-bg:#1b2a1e; --good-b:#366740;
    --danger:#ff977d; --danger-s:#e54d2e; --danger-bg:#391714; --danger-b:#853a2d;
    --warn:#ffca16; --warn-s:#ffc53d; --warn-bg:#302008; --warn-b:#714f19;
    --violet:#9b8cff; --violet-bg:#251e3e; --violet-b:#473876;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --row-h:40px;
  }
  :root[data-theme="light"]{
    --bg:#fafafa; --s1:#fff; --s2:#f7f8f9; --s3:#eff1f3; --s4:#e6e9ec;
    --border:#e6e8eb; --border2:#d7dbdf; --text:#1a1d21; --muted:#60646c; --dim:#8b8f98;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3;
  }
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#fafafa; --s1:#fff; --s2:#f7f8f9; --s3:#eff1f3; --s4:#e6e9ec;
    --border:#e6e8eb; --border2:#d7dbdf; --text:#1a1d21; --muted:#60646c; --dim:#8b8f98;
    --accent:#0068d6; --accent-t:#0068d6; --accent-bg:#e6f0fd; --accent-b:#8ec0f6;
    --good:#2a7e3b; --good-bg:#e6f6e9; --good-b:#b4dfbb;
    --danger:#c22f16; --danger-bg:#fdeae4; --danger-b:#f3b7a3;
    --warn:#9a6700; --warn-bg:#fdf3d0; --warn-b:#e8cf8a;
    --violet:#6a58d6; --violet-bg:#ece9fb; --violet-b:#c3b9f3;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 60px}
  a{color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:14px 0 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--accent),var(--violet));display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
  h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--dim);font-weight:500;font-size:13px;margin-left:6px}
  .hr{display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--good-s);animation:pulse 2s infinite}
  .live.stale .pulse{background:var(--warn-s);animation:none}
  .live.dead .pulse{background:var(--danger-s);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,167,88,.5)}70%{box-shadow:0 0 0 6px rgba(70,167,88,0)}100%{box-shadow:0 0 0 0 rgba(70,167,88,0)}}
  .tgl{cursor:pointer;background:var(--s2);border:1px solid var(--border2);color:var(--muted);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;font-size:14px}
  .prog{height:2px;background:var(--accent);width:0;transition:width 1s linear;opacity:.7}

  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-top:2px;overflow-x:auto}
  .grp{display:flex;gap:2px;align-items:center}
  .grp+.grp{margin-left:10px;padding-left:10px;border-left:1px solid var(--border)}
  .tab{appearance:none;background:none;border:none;cursor:pointer;padding:11px 12px;font-size:13px;font-weight:500;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .tab:hover{color:var(--text)} .tab.on{color:var(--text);border-bottom-color:var(--accent)}
  .tab .ct{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--s3);border-radius:999px;padding:1px 6px}
  .tab.on .ct{color:var(--accent-t);background:var(--accent-bg)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:4px}

  /* lane head */
  .lanehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:16px 0 10px;flex-wrap:wrap}
  .lanetitle{font-size:14px;color:var(--text);max-width:640px;line-height:1.5}
  .lanetitle b{color:var(--text)}
  .stat{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
  .stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:var(--text);line-height:1}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:500}
  details.readme{margin:0 0 12px}
  details.readme summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;user-select:none;display:inline-flex;align-items:center;gap:5px}
  details.readme summary::before{content:"▸";color:var(--dim)} details.readme[open] summary::before{content:"▾"}
  details.readme .rd{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--s1);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:11px 14px}
  details.readme .rd b{color:var(--text)}

  /* table */
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--s1)}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:640px}
  .tbl th{position:sticky;top:0;z-index:2;background:var(--s2);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);text-align:left;padding:0 12px;height:34px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap}
  .tbl th.n{text-align:right} .tbl th.c{text-align:center}
  .tbl th.sortable::after{content:"↕";margin-left:5px;color:var(--dim);font-size:9px}
  .tbl th[aria-sort=ascending]::after{content:"▲";color:var(--accent-t)}
  .tbl th[aria-sort=descending]::after{content:"▼";color:var(--accent-t)}
  .tbl td{height:var(--row-h);padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  .tbl td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tbl td.c{text-align:center}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover td{background:var(--s3)}
  .tbl tbody tr{cursor:pointer}
  .up{color:var(--good)} .down{color:var(--danger)} .flat{color:var(--dim)}
  .tbl tr.flash-up td{animation:fu 1s ease-out} .tbl tr.flash-down td{animation:fd 1s ease-out}
  @keyframes fu{from{background:rgba(70,167,88,.20)}to{background:transparent}}
  @keyframes fd{from{background:rgba(229,77,46,.20)}to{background:transparent}}

  /* identity cell */
  .idc{display:flex;align-items:center;gap:9px;min-width:0}
  .tk{width:26px;height:26px;border-radius:7px;background:var(--s3);border:1px solid var(--border2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;text-transform:uppercase}
  .idc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .idc .sub{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--s3);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-good{background:var(--good-bg);color:var(--good);border-color:var(--good-b)}
  .b-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-b)}
  .b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
  .b-violet{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-b)}
  .b-accent{background:var(--accent-bg);color:var(--accent-t);border-color:var(--accent-b)}
  .glyphs{display:inline-flex;gap:3px}
  .g{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700}
  .g.ok{background:var(--good-bg);color:var(--good)} .g.bad{background:var(--danger-bg);color:var(--danger)}
  .g.na{background:var(--s3);color:var(--dim)}
  .mtri{display:inline-flex;gap:6px;font-family:var(--mono);font-size:11px}
  .hero{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
  .bar{display:inline-block;height:5px;border-radius:3px;background:var(--accent);vertical-align:middle;min-width:2px}
  .exp td{background:var(--s2);padding:12px 14px;white-space:normal;font-size:12.5px;color:var(--muted);line-height:1.6}
  .exp b{color:var(--text)} .exp .so{color:var(--accent-t);font-weight:600}
  .empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:13px}
  .skl{height:var(--row-h);border-bottom:1px solid var(--border);background:linear-gradient(90deg,var(--s1) 25%,var(--s3) 50%,var(--s1) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

  /* perp: carry section header + heatmap */
  .perp-sec{font-size:12px;font-weight:650;color:var(--text);margin:2px 0 9px;letter-spacing:.02em}
  .perp-sec small{font-weight:500;color:var(--dim);letter-spacing:0}
  .sc-card{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;padding:10px 14px;margin:0 0 11px;
    background:var(--s1);border:1px solid var(--border);border-radius:10px}
  .sc-card .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sc-card .v{display:flex;gap:5px;align-items:baseline}
  .sc-card .v .num{font-size:16px;font-weight:650}
  .sc-card .v small{color:var(--dim);font-size:11px}
  .sc-card.muted .v{color:var(--dim);font-size:13px}
  .hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .cell{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--s1);display:flex;flex-direction:column;gap:5px;cursor:pointer}
  .cell .sy{font-weight:650;font-size:13px}
  .cell .fu{font-family:var(--mono);font-size:15px;font-weight:600}
  .cell .mt{font-size:10.5px;color:var(--muted)}
  .foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
  @media(max-width:600px){h1 span{display:none}.stat{gap:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">◎</div>
      <div><h1>机会雷达<span>Alpha Radar · 五结构</span></h1></div></div>
    <div class="hr">
      <span class="live" id="live"><span class="pulse"></span><span id="livet">LIVE</span></span>
      <div class="tgl" id="tgl" title="切换主题">◐</div>
    </div>
  </header>
  <div class="prog" id="prog"></div>

  <div class="tabs" role="tablist" id="tabs">
    <div class="grp">
      <button class="tab on" data-v="watch" role="tab">🐋 实时买入 <span class="ct" id="ct-watch"></span></button>
      <button class="tab" data-v="opp" role="tab">💎 早期扫描 <span class="ct" id="ct-opp"></span></button>
      <button class="tab" data-v="avoid" role="tab">🛡️ 避雷 <span class="ct" id="ct-avoid"></span></button>
    </div>
    <div class="grp">
      <button class="tab" data-v="perp" role="tab">🔥 永续拥挤 <span class="ct" id="ct-perp"></span></button>
    </div>
    <div class="grp">
      <button class="tab" data-v="op" role="tab">💰 庄 <span class="ct" id="ct-op"></span></button>
    </div>
  </div>

  <div class="lanehead">
    <div class="lanetitle" id="lanetitle"></div>
    <div class="stat" id="lanestat"></div>
  </div>
  <details class="readme" id="readme"><summary>读我 · 这条线怎么用 / 诚实边界</summary><div class="rd" id="rd"></div></details>
  <div id="view"></div>

  <div class="foot"><span id="gen">—</span><span>每 15 分钟自动刷新 · 只是雷达不是买卖指令 · 风险自负</span></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtUsd=n=>n==null?"—":(n=+n,Math.abs(n)>=1e6?(n/1e6).toFixed(2)+"M":Math.abs(n)>=1e3?Math.round(n/1e3)+"k":Math.round(n));
const usd=n=>n==null?"—":"$"+fmtUsd(n);
const pctc=n=>n==null?'<span class="flat">—</span>':`<span class="${n>0?'up':n<0?'down':'flat'}">${n>0?'+':''}${(+n).toFixed(n>=100||n<=-100?0:1)}%</span>`;
const short=a=>a?a.slice(0,4)+"…"+a.slice(-4):"—";
const ageStr=h=>h==null?"—":h<1/60?"<1m":h<1?Math.round(h*60)+"m":h<24?h.toFixed(1)+"h":Math.round(h/24)+"d";
function rel(ts){if(!ts)return"—";const s=Math.round(Date.now()/1000-ts);return s<5?"刚刚":s<60?s+"秒前":s<3600?Math.floor(s/60)+"分前":Math.floor(s/3600)+"时前"}
function relMs(t){const s=Math.round((Date.now()-t)/1000);return s<5?"刚刚":s<60?s+"s前":s<3600?Math.floor(s/60)+"分前":Math.floor(s/3600)+"时前"}

let view="watch", data={watch:null,opp:null,perp:null,op:null,stats:null}, lastPoll=0;
const prevKey={};   // per-lane {rowId: heroValue} for flash
let sortState={};   // per-lane {col, dir}

// ---------- generic table renderer ----------
function renderTable(laneId, rows, cols, cfg){
  if(!rows||!rows.length) return `<div class="scroll"><div class="empty">${cfg.empty||"这轮没有信号 —— 好机会本就稀疏,不是坏了。"}</div></div>`;
  // sort
  const ss=sortState[laneId];
  if(ss){const c=cols.find(x=>x.k===ss.col); if(c&&c.sort){rows=rows.slice().sort((a,b)=>{const x=c.sort(a),y=c.sort(b);const r=(x>y?1:x<y?-1:0);return ss.dir==="asc"?r:-r})}}
  const head=cols.map(c=>`<th class="${c.n?'n':c.c?'c':''} ${c.sort?'sortable':''}" data-col="${c.k}" ${ss&&ss.col===c.k?`aria-sort="${ss.dir==='asc'?'ascending':'descending'}"`:''}>${c.label}</th>`).join("");
  const prev=prevKey[laneId]||{};
  const cur={};
  const body=rows.map((r,i)=>{
    const id=cfg.id(r); const hv=cfg.flash?cfg.flash(r):null; if(hv!=null)cur[id]=hv;
    let fc=""; if(hv!=null&&prev[id]!=null&&prev[id]!==hv)fc=hv>prev[id]?"flash-up":"flash-down";
    const tds=cols.map(c=>`<td class="${c.n?'n':c.c?'c':''}">${c.cell(r)}</td>`).join("");
    const det=cfg.detail?`<tr class="exp" data-exp="${id}" hidden><td colspan="${cols.length}">${cfg.detail(r)}</td></tr>`:"";
    return `<tr class="${fc}" data-row="${id}" data-i="${i}">${tds}</tr>${det}`;
  }).join("");
  prevKey[laneId]=cur;
  return `<div class="scroll"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// chip / glyph helpers
const riskChip=lv=>lv==="high"?'<span class="chip b-danger"><span class="d"></span>接盘高</span>':lv==="med"?'<span class="chip b-warn"><span class="d"></span>接盘中</span>':'<span class="chip b-good"><span class="d"></span>接盘低</span>';
const rugChip=lv=>lv==="avoid"?'<span class="chip b-danger">🔴雷</span>':lv==="caution"?'<span class="chip b-warn">🟠险</span>':lv==="clean"?'<span class="chip b-good">🟢净</span>':'<span class="chip">⚪?</span>';
const mtri=o=>`<span class="mtri">${pctc(o.pc_1m)}<span class="dim">/</span>${pctc(o.pc_5m)}<span class="dim">/</span>${pctc(o.pc_1h??o.price_chg_1h)}</span>`;
const idc=(name,sub,glyph)=>`<div class="idc"><div class="tk">${esc((name||'?').slice(0,2))}</div><div style="min-width:0"><div class="nm">${esc(name||'?')}</div><div class="sub">${esc(sub||'')}</div></div></div>`;

// ---------- lane configs ----------
const CHAIN={solana:"SOL",bsc:"BSC",ethereum:"ETH",base:"BASE",arbitrum:"ARB"};
function walletName(w,i){return "聪明钱#"+(i+1)}

const LANES={
  watch:{
    title:d=>`最早的信号:盯 <b>${d?.watched_wallets||0}</b> 个已验证盈利钱包,谁<b>刚买了什么</b>——分钟级,早于任何排名。`,
    stat:d=>{const s=d?.watch||[];const c=s.filter(x=>x.n_buyers>=2).length;return[["窗口内",s.length,""],["收敛",c,"个多钱包同买"]]},
    readme:"收敛(≥2个独立聪明钱同窗买同一个)是能给的最强早信号。诚实天花板:仍晚于创建区块的内部狙击者(1-5分钟清仓);<b>单个钱包买=线索不是确认</b>。铁律:小仓、2x卖回本金、止损。",
    rows:d=>d?.watch||[],
    id:r=>r.chain+r.token, flash:r=>r.n_buyers,
    empty:"这批聪明钱最近没买新东西(正常,好机会稀疏)。每15分钟刷新。",
    cols:[
      {k:"sym",label:"代币",cell:r=>idc(r.symbol,CHAIN[r.chain]||r.chain),sort:r=>r.symbol||""},
      {k:"n",label:"聪明钱",n:1,cell:r=>`<span class="hero ${r.n_buyers>=2?'up':''}">${r.n_buyers}</span>${r.n_buyers>=2?' <span class="chip b-good">收敛</span>':''}`,sort:r=>r.n_buyers},
      {k:"usd",label:"买入额",n:1,cell:r=>usd(r.usd_bought),sort:r=>r.usd_bought||0},
      {k:"t",label:"何时",n:1,cell:r=>r.mins_ago!=null?`<span class="up">${r.mins_ago<60?r.mins_ago+'分前':(r.mins_ago/60).toFixed(1)+'时前'}</span>`:"—",sort:r=>r.mins_ago??1e9},
    ],
    detail:r=>`<b>${r.n_buyers}</b> 个已验证盈利钱包${r.n_buyers>=2?'同窗':''}买入。<span class="so">所以👉</span> ${r.n_buyers>=2?"多个独立聪明钱同进=最强早信号,快查合约再小仓埋伏。":"只有一个,当线索;等第二个跟进。"}<br>买入钱包: ${(r.buyers||[]).map((w,i)=>walletName(w,i)+" ("+short(w)+")").join(" · ")}<br>${esc(r.token||"")}`,
  },
  opp:{
    title:d=>`新低流通币里聪明钱<b>刚进场</b>的——<b>先够新、再接盘风险低</b>排序(把"你当接盘侠概率"压在上涨潜力前)。`,
    stat:d=>{const s=(d?.opportunities||[]);return[["命中",s.length,""],["确认新鲜",s.filter(x=>x.confirmed_fresh).length,"<12h"],["低接盘险",s.filter(x=>x.exit_risk?.level==="low").length,""]]},
    readme:"残酷基率:pump.fun 只 ~3% 交易者赚过 $1k、99% 币归零、跟单只赚被跟者零头(3% vs 14%)。这板子<b>帮你避开当接盘侠</b>,不保证赚。动量列 1m/5m/1h 各自染色。",
    rows:d=>d?.opportunities||[],
    id:r=>r.chain+r.token, flash:r=>r.smart_money,
    cols:[
      {k:"sym",label:"代币",cell:r=>idc(r.symbol,(CHAIN[r.chain]||r.chain)+" · "+ageStr(r.age_hours)),sort:r=>r.symbol||""},
      {k:"sm",label:"聪明钱",n:1,cell:r=>`<span class="hero ${r.confirmed_fresh?'up':''}">${r.smart_money??0}</span>${r.renowned?`<span class="dim num"> +${r.renowned}名</span>`:''}`,sort:r=>r.smart_money??0},
      {k:"xr",label:"接盘险",c:1,cell:r=>riskChip(r.exit_risk?.level),sort:r=>({low:0,med:1,high:2})[r.exit_risk?.level]??0},
      {k:"sec",label:"安全",c:1,cell:r=>rugChip(r.rug?.level)+(r.manipulation?.level!=="clean"?' <span class="chip b-warn">操纵</span>':''),sort:r=>r.rug?.level==="avoid"?2:r.rug?.level==="caution"?1:0},
      {k:"mo",label:"1m/5m/1h",n:1,cell:r=>mtri(r),sort:r=>r.pc_5m??0},
      {k:"liq",label:"流动性",n:1,cell:r=>usd(r.liq),sort:r=>r.liq||0},
      {k:"mc",label:"市值",n:1,cell:r=>usd(r.mcap),sort:r=>r.mcap||0},
    ],
    detail:r=>{const xr=r.exit_risk||{},rug=r.rug||{},mp=r.manipulation||{};
      return `<span class="so">所以👉</span> ${xr.level==="high"?"高概率你是接盘侠,别碰。":xr.level==="med"?"有接盘信号,极小仓。":"够新+聪明钱刚进+没明显接盘信号=能埋伏,小仓+止损。"} `+
      `狙击 ${r.snipers??"—"} · 机器人 ${r.bots??"—"}${xr.reasons?.length?"<br>接盘信号: "+xr.reasons.map(esc).join("、"):""}${rug.facts?.length?"<br>合约: "+rug.facts.map(esc).join("、"):""}${mp.reasons?.length?"<br>操纵: "+mp.reasons.map(esc).join("、"):""}<br>${esc(r.token||"")}`},
  },
  avoid:{
    title:d=>`看着诱人、其实是<b>圈套</b>的——聪明钱榜里被检测出合约有雷或捆绑/诱捕/机器人刷量的币。`,
    stat:d=>{const b=avoidRows(d);return[["危险",b.length,"个"]]},
    readme:"#4(MEV/操纵污染,来自 GMGN 捆绑率/诱捕率/机器人占比)+ #5(蜜罐/税/未开源)的防御线。聪明钱在买但被操纵=你很可能是被钓的接盘方。",
    rows:d=>avoidRows(d),
    id:r=>r.chain+r.token, flash:null,
    empty:"当前榜里没检测到明显圈套——但不等于安全,合约仍可能事后作恶。",
    cols:[
      {k:"sym",label:"代币",cell:r=>idc(r.symbol,CHAIN[r.chain]||r.chain),sort:r=>r.symbol||""},
      {k:"v",label:"危险",c:1,cell:r=>{const hard=r.rug?.level==="avoid"||r.manipulation?.level==="severe"||r.exit_risk?.level==="high";return hard?'<span class="chip b-danger">🔴别碰</span>':'<span class="chip b-warn">🟠谨慎</span>'},sort:r=>(r.rug?.level==="avoid"?2:0)+(r.manipulation?.level==="severe"?2:0)},
      {k:"why",label:"问题",cell:r=>{const f=[...(r.rug?.facts||[]),...(r.manipulation?.reasons||[]),...(r.exit_risk?.level!=="low"?(r.exit_risk?.reasons||[]):[])];return `<span style="white-space:normal;color:var(--muted)">${esc(f.slice(0,2).join("、")||"—")}</span>`},sort:r=>0},
      {k:"sm",label:"聪明钱",n:1,cell:r=>r.smart_money??0,sort:r=>r.smart_money??0},
      {k:"liq",label:"流动性",n:1,cell:r=>usd(r.liq),sort:r=>r.liq||0},
    ],
    detail:r=>{const f=[...(r.rug?.facts||[]),...(r.manipulation?.reasons||[]),...(r.exit_risk?.reasons||[])];return `<span class="so">所以👉</span> 聪明钱在买也别碰——很可能在钓你接盘或合约能作恶。<br>${f.map(esc).join("、")}<br>${esc(r.token||"")}`},
  },
  perp:{
    title:d=>{const c=d?.carry||[];const mj=c.filter(x=>x.is_major).length;return `<b style="color:var(--good)">资金费套利是这里唯一对个人可复制的正EV核</b>:现货多+永续空,吃杠杆多头付的费,不赌方向。当前 <b>${c.length}</b> 个机会(<b>${mj}</b> 个主流)。下面拥挤/点火是方向观测,防御用不是买卖指令。`},
    stat:d=>{const c=d?.carry||[];const mj=c.filter(x=>x.is_major).length;const top=c[0];return[["套利机会",c.length,""],["主流(较净)",mj,""],["最高年化",top?`+${top.sustained_ann}%`:"—",top?top.tier:""]]},
    readme:"这条线的<b>真核是💰资金费套利</b>(delta中性:现货多+永续空,吃杠杆多头付的费,~8%基准起,主流更净)——研究里唯一「个人真能做出正EV」的核。<b>但这是carry不是无风险套利</b>:费率翻负要倒付、空腿被挤压强平、交易所暴雷/脱锚(2025-10-10 USDe 在 Binance 砸到 $0.65 强平了偿付充足的账户)。年化为毛,未扣手续费/滑点。下面的拥挤/点火是<b>方向观测</b>:裸做多散户 74-89% 亏,当「我是不是站在被清算那侧」的防御用,不是做空按钮。",
    rows:d=>d?.perps||[],
    custom:true,
  },
  op:{
    title:d=>{const o=(d?.operators||[]).filter(x=>x.ok);const c={};o.forEach(x=>c[classOp(x)]=(c[classOp(x)]||0)+1);return `盯着的币里<b>真有庄在做盘的只有 ${(c.armed||0)+(c.accum||0)+(c.dump||0)} 个</b>;<b style="color:var(--violet)">${c.issuer||0} 个其实是项目方持币不是妖币</b>。`},
    stat:d=>{const o=d?.operators||[];return[["哨兵",o.length,""],["真操盘",o.filter(x=>["armed","accum","dump"].includes(classOp(x))).length,""]]},
    readme:"这条线是<b>派发/做空探测器 + 庄vs发行方判别器,不是跟买器</b>。顶刊实证:跟庄买吸筹对散户是<b>负EV</b>(pump 后~18秒见顶、非insider负回报、跟随者胜率48%)。你检测到的「吸筹」很可能是庄的 183-22832 地址 wash farm 专门造给你的诱饵。有结构性 edge 的只在<b>派发(可做空/避开)</b>和 operator-vs-issuer 判别,不在买。集中≠妖币——用链上首笔资金来源把「庄买入」和「项目方分配」分开。",
    rows:d=>(d?.operators||[]).slice().sort((a,b)=>OPRANK[classOp(a)]-OPRANK[classOp(b)]),
    id:r=>r.chain+r.token, flash:null,
    cols:[
      {k:"sym",label:"代币",cell:r=>idc(r.symbol,CHAIN[r.chain]||r.chain),sort:r=>r.symbol||""},
      {k:"v",label:"判读",c:1,cell:r=>{const k=classOp(r);const m=OPMAP[k];return `<span class="chip b-${m.b}">${m.label}</span>`},sort:r=>OPRANK[classOp(r)]},
      {k:"conc",label:"最大持有",n:1,cell:r=>{const p=r.largest_entity_pct;return p==null?"—":`<span class="num">${(+p).toFixed(1)}%</span> <span class="bar" style="width:${Math.min(p,40)*1.4}px;background:var(--${classOp(r)==='issuer'?'violet':'accent'})"></span>`+(r.supply_verified===false?' <span class="chip b-warn">未核实</span>':'')},sort:r=>r.largest_entity_pct||0},
      {k:"acq",label:"获取",c:1,cell:r=>{const a=r.acquisition;return a==="bought"?'<span class="chip b-good">买入</span>':a==="allocated"?'<span class="chip b-violet">分配</span>':'<span class="chip">?</span>'},sort:r=>r.acquisition||""},
      {k:"liq",label:"流动性",n:1,cell:r=>usd(r.liquidity_usd),sort:r=>r.liquidity_usd||0},
    ],
    detail:r=>{const m=OPMAP[classOp(r)];return `<span class="so">所以👉</span> ${m.so}<br>判决 ${esc(r.verdict||"—")} · 置信 ${r.confidence??"—"} · ${r.dominant_wallets??"—"}钱包/${r.entity_count??"—"}实体${r.caveats?.length?"<br>"+r.caveats.map(esc).join("<br>"):""}<br>${esc(r.token||"")}`},
  },
};

function avoidRows(d){return (d?.opportunities||[]).filter(o=>["avoid","caution"].includes(o.rug?.level)||["moderate","severe"].includes(o.manipulation?.level)||o.exit_risk?.level==="high")
  .sort((a,b)=>{const sev=x=>(x.rug?.level==="avoid"?3:0)+(x.manipulation?.level==="severe"?3:x.manipulation?.level==="moderate"?1:0)+(x.exit_risk?.level==="high"?2:0);return sev(b)-sev(a)})}

// operator classifier
const OPMAP={dump:{label:"正在出货",b:"danger",so:"对手盘就是庄,别接飞刀,要动只能空。"},armed:{label:"庄在场·待动",b:"warn",so:"盯着等它出手,现在不是买卖点。"},accum:{label:"疑似吸筹",b:"warn",so:"别跟买——跟庄吸筹对散户是负EV,且这「吸筹」可能是庄的wash farm诱饵。当观察,不当买入信号。"},issuer:{label:"项目方持币",b:"violet",so:"别当妖币,防的是团队解锁砸盘。"},faded:{label:"庄已走·散",b:"",so:"当普通币看。"},unknown:{label:"查不清",b:"accent",so:"数据不足,别信这条。"}};
const OPRANK={dump:0,armed:1,accum:2,issuer:3,faded:4,unknown:5};
function classOp(r){if(!r.ok)return"unknown";const v=r.verdict||"",a=r.acquisition||"";if(a==="allocated")return"issuer";if(["distributing","exited_by_selling","present_rotating_confirmed","distributing_or_churn"].includes(v))return((r.largest_entity_pct||0)<5&&(r.dominant_wallets||0)<=1)?"faded":"dump";if(v==="loaded_accumulating")return"accum";if(["loaded_live_operator","live_operator"].includes(v))return(r.current_graph_available&&(r.largest_entity_pct||0)<2)?"unknown":"armed";if(v==="loaded_dormant")return"armed";if(["dispersed","treasury","treasury_only"].includes(v))return"faded";return"unknown"}

// perp: carry screener (the real edge, on top) + crowding/ignition heatmap (defense, below)
function renderPerp(d){
  const carry=d?.carry||[], s=d?.perps||[];
  if(!carry.length && !s.length) return `<div class="scroll"><div class="empty">当前无正资金费机会,市场杠杆也不拥挤 —— 这本身是个信息。</div></div>`;
  let html="";
  // ── CARRY: delta-neutral funding arbitrage — the ONE replicable positive-EV core ──
  if(carry.length){
    const rows=carry.slice(0,20).map(c=>{
      const pf=c.pos_frac, drift=c.sustained_ann!==c.funding_ann;
      const flags=c.flags.length?c.flags.map(f=>`<span class="chip b-warn">${esc(f.split(":")[0].split("(")[0])}</span>`).join(" ")
                                :'<span class="chip b-good">干净</span>';
      return `<tr title="${esc(c.note)}">
        <td>${idc(c.symbol,c.tier)}</td>
        <td class="n"><span class="num" style="color:var(--good)">+${c.sustained_ann}%</span>${drift?`<small class="dim"> 现${c.funding_ann>0?'+':''}${c.funding_ann}%</small>`:''}</td>
        <td class="n">${pf!=null?`<span class="num">${(pf*100).toFixed(0)}%</span>`:'<small class="dim">积累中</small>'}</td>
        <td class="n"><span class="num">${usd(c.oi_usd)}</span></td>
        <td>${flags}</td></tr>`}).join("");
    const sc=d?.carry_scorecard;
    let scBanner="";
    if(sc){ if(sc.verdict==="measured"){
        scBanner=`<div class="sc-card"><span class="k">主流carry已实现战绩·近${sc.span_h}h</span>
          <span class="v"><span class="num" style="color:var(--good)">+${sc.realized_ann}%</span><small>已实现年化(毛)</small></span>
          <span class="v"><span class="num">${(sc.pos_frac*100).toFixed(0)}%</span><small>时间正费</small></span>
          <span class="v"><span class="num" style="color:var(--danger)">${sc.worst_ann}%</span><small>最差瞬时</small></span></div>`;
      } else scBanner=`<div class="sc-card muted"><span class="k">主流carry已实现战绩</span><span class="v">不可判 <small>${esc(sc.note||'')}</small></span></div>`; }
    html+=`<div class="perp-sec">💰 资金费套利 · delta中性 <small>现货多+永续空,吃杠杆多头付的费,不赌方向 · 主流优先 · 年化为毛(未扣手续费/滑点)</small></div>
      ${scBanner}
      <div class="scroll"><table class="tbl"><thead><tr>
        <th>代币</th><th class="n">年化资金费</th><th class="n">持续性</th><th class="n">OI深度</th><th>风险</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  // ── CROWDING / IGNITION: directional observation — defensive, not a trade button ──
  if(s.length){
    const col=p=>{const fa=p.funding_ann;const a=Math.min(Math.abs(fa)/300,1);
      if(p.signal==="ignition")return{bg:`color-mix(in srgb,var(--good) ${20+a*30}%,var(--s1))`,b:"var(--good-b)"};
      return{bg:`color-mix(in srgb,var(--${fa>0?'danger':'warn'}) ${15+a*35}%,var(--s1))`,b:`var(--${fa>0?'danger':'warn'}-b)`}};
    html+=`<div class="perp-sec" style="margin-top:16px">🌡️ 拥挤 / 点火 <small>方向观测 · 判断你是不是站在被清算那侧 · 防御用,非买卖指令</small></div>
      <div class="hm">`+s.map(p=>{const c=col(p);const lab=p.signal==="ignition"?(p.direction==="up"?"🔥点火↑":"🔥点火↓"):(p.direction==="longs_crowded"?"多头拥挤":"空头拥挤");
      return `<div class="cell" style="background:${c.bg};border-color:${c.b}" data-perp='${esc(JSON.stringify(p.why))}'>
        <div class="sy">${esc(p.symbol)} <span class="chip">${lab}</span></div>
        <div class="fu ${p.funding_ann>0?'down':'up'}">${p.funding_ann>0?'+':''}${p.funding_ann}%<small style="color:var(--dim)">/年</small></div>
        <div class="mt">OI ${usd(p.oi_usd)} · 24h ${p.price_chg_24h!=null?(p.price_chg_24h>0?'+':'')+(+p.price_chg_24h).toFixed(1)+'%':'—'}</div>
      </div>`}).join("")+`</div>`;
  }
  return html;
}

// ---------- paint ----------
function paint(){
  const L=LANES[view], d=data[view==="avoid"?"opp":view];
  $("lanetitle").innerHTML=L.title(d);
  const st=(L.stat(d)||[]).slice();
  const ls=data.stats?.lanes?.[view];
  if(ls){ if(ls.verdict==="measured"){
      st.push(["本线命中率",`${(ls.rate*100).toFixed(0)}%`,`${ls.hits}/${ls.n} Wilson[${(ls.lo*100).toFixed(0)}-${(ls.hi*100).toFixed(0)}%]`]);
      if(ls.base_rate!=null) st.push(["vs 基准率",`${(ls.base_rate*100).toFixed(0)}%`,`lift ${ls.lift} · ${ls.edge||''}`]);
    } else st.push(["本线命中率","不可判",`积累${ls.n}/20`]); }
  $("lanestat").innerHTML=st.map(([k,v,s])=>`<div><span class="k">${k}</span><span class="v">${v}<small> ${s||''}</small></span></div>`).join("");
  $("rd").innerHTML=L.readme;
  $("view").innerHTML = view==="perp"?renderPerp(d) : (L.custom?"":renderTable(view, L.rows(d), L.cols, L));
  // counts
  for(const [k,l] of Object.entries(LANES)){const dd=data[k==="avoid"?"opp":k];const n=dd?(l.rows?l.rows(dd).length:0):0;const el=$("ct-"+k);if(el)el.textContent=n||""}
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===view));
  wireRows();
  staleness();
}
function wireRows(){
  document.querySelectorAll("tr[data-row]").forEach(tr=>tr.onclick=()=>{
    const ex=document.querySelector(`tr.exp[data-exp="${tr.dataset.row}"]`); if(ex)ex.hidden=!ex.hidden;});
  document.querySelectorAll("th[data-col]").forEach(th=>{const c=LANES[view].cols?.find(x=>x.k===th.dataset.col);if(!c||!c.sort)return;
    th.onclick=()=>{const ss=sortState[view]||{};sortState[view]=ss.col===c.k?{col:c.k,dir:ss.dir==="desc"?"asc":"desc"}:{col:c.k,dir:"desc"};paint()}});
}
function staleness(){
  const d=data[view==="avoid"?"opp":view], el=$("live");
  if(!d){el.className="live dead";$("livet").textContent="无数据";return}
  const gen=new Date(d.generated_at).getTime(), next=new Date(d.next_expected_at).getTime(), now=Date.now();
  $("gen").textContent="数据更新于 "+relMs(gen);
  if(now<next+15*6e4){el.className="live";$("livet").textContent="LIVE · "+relMs(gen)}
  else if(now-gen<864e5){el.className="live stale";$("livet").textContent="陈旧 "+relMs(gen)}
  else{el.className="live dead";$("livet").textContent="超24h,别信"}
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.v;paint()});
$("tgl").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const n=c==="light"?"dark":c==="dark"?"light":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("th",n)}catch(e){}};
try{const t=localStorage.getItem("th");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

// poll progress bar
let pt=0; setInterval(()=>{pt=(pt+1)%60;$("prog").style.width=(pt/60*100)+"%"},1000);

async function load(){
  const b="?t="+Math.floor(Date.now()/6e4);
  const r=await Promise.allSettled(["watch","perps","opportunities","operators","stats"].map(v=>fetch("/data/"+v+".json"+b).then(x=>x.ok?x.json():null)));
  const [wt,p,o,op,st]=r.map(x=>x.status==="fulfilled"?x.value:null);
  if(wt&&wt.schema_version===1)data.watch=wt;
  if(p&&p.schema_version===1)data.perp=p;
  if(o&&o.schema_version===1)data.opp=o;
  if(op&&op.schema_version===1)data.op=op;
  if(st&&st.schema_version===1)data.stats=st;
  lastPoll=Date.now(); pt=0;
  paint();
}
$("view").innerHTML=`<div class="scroll">${'<div class="skl"></div>'.repeat(6)}</div>`;
load(); setInterval(load,6e4);
</script>
